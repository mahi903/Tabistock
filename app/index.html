<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#fbf9f4">
<title>Tabistock</title>
<link rel="icon" href="/favicon-32x32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
// iPhone アプリ（Capacitor）の中で開いたときの目印。ホーム画面のPWAと同じく、時計やダイナミックアイランドの帯の下から画面を始める
(function(){function chk(){var C=window.Capacitor;if(C&&((C.isNativePlatform&&C.isNativePlatform())||C.platform==="ios"))document.documentElement.classList.add("native");}chk();document.addEventListener("DOMContentLoaded",chk);})();
</script>
<meta name="apple-mobile-web-app-title" content="Tabistock β">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="./app.css?v=202611250004">
</head>
<body>
<div id="app">
<!-- 起動画面：ロゴの下のゲージが溜まったらホームへ（iPhoneアプリとホーム画面のPWAで開いたときだけ） -->
<div id="splash" hidden><div class="lk" aria-label="Tabistock"><svg class="mk" viewBox="20 210 1150 900"><defs><linearGradient id="tbStem" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#244f3e"/><stop offset=".55" stop-color="#3a7e60"/><stop offset="1" stop-color="#43926e"/></linearGradient>
<linearGradient id="tbBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4b9a78"/><stop offset="1" stop-color="#3f8c6b"/></linearGradient></defs><g class="ly ly2"><rect x="1019" y="480" width="86" height="40" rx="18" fill="#bfe5d4"/><path d="M1062 498 V638 L560 849" fill="none" stroke="#bfe5d4" stroke-width="86" stroke-linejoin="round" stroke-linecap="butt"/></g><g class="ly ly1"><rect x="949" y="425" width="86" height="40" rx="18" fill="#8fd2b2"/><path d="M992 443 V583 L560 764" fill="none" stroke="#8fd2b2" stroke-width="86" stroke-linejoin="round" stroke-linecap="butt"/></g><g class="ly ly0"><rect x="879" y="370" width="86" height="40" rx="18" fill="#5bbd8a"/><path d="M922 388 V528 L560 680" fill="none" stroke="#5bbd8a" stroke-width="86" stroke-linejoin="round" stroke-linecap="butt"/></g><path class="st" d="M385 560 H705 V975 A90 90 0 0 1 615 1065 H475 A90 90 0 0 1 385 975 Z" fill="url(#tbStem)"/><g class="br"><path d="M225 258 H795 A90 90 0 0 1 885 348 V490 A90 90 0 0 1 795 580 H225 A160 160 0 0 1 65 420 V418 A160 160 0 0 1 225 258 Z" fill="url(#tbBar)"/><path class="dk" d="M405 580 L760 258 H795 A90 90 0 0 1 885 348 V490 A90 90 0 0 1 795 580 Z" fill="#1d3b2d"/></g></svg><div class="wd"><img src="img/wl0.png" alt=""><img src="img/wl1.png" alt=""><img src="img/wl2.png" alt=""><img src="img/wl3.png" alt=""><img src="img/wl4.png" alt=""><img src="img/wl5.png" alt=""><img src="img/wl6.png" alt=""><img src="img/wl7.png" alt=""><img src="img/wl8.png" alt=""></div></div></div>
<script>(function(){var s=document.getElementById("splash");var C=window.Capacitor;var app=(C&&((C.isNativePlatform&&C.isNativePlatform())||C.platform==="ios"))||navigator.standalone||matchMedia("(display-mode: standalone)").matches;if(app&&!sessionStorage.getItem("tbs-splash")){s.hidden=false;window.__splashAt=Date.now();}})();</script>

<!-- ホーム -->
<section class="view" id="home">
  <div class="top"><img src="./logo.png" alt="Tabistock" onerror="this.outerHTML='<b style=&quot;font-family:Manrope;font-weight:800;font-size:24px;color:#1f6f5b&quot;>Tabistock</b>'">
    <div class="tic">
      <button class="ti" id="bellBtn" aria-label="通知"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1b2330" stroke-width="1.8" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg><i id="bellDot" hidden></i></button>
      <button class="ti" id="dmBtn" aria-label="メッセージ"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1b2330" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M21 3 10 14"/><path d="M21 3l-7 18-4-7-7-4z"/></svg><b id="dmBadge" hidden></b></button>
    </div>
  </div>
  <div class="htabs" id="htabs"><button class="on" data-ht="0">おすすめ</button><button data-ht="1">フォロー中</button><button data-ht="2">旅の掲示板</button></div>
  <div id="recPane">
    <div id="feat"></div>
    <div class="sh"><button class="shl" data-go="search" data-reset="1"><h2>海外旅行</h2><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button></div>
    <div class="hs" id="newList"><p class="loading">読み込み中…</p></div>
    <div id="jpSec" hidden><div class="sh"><button class="shl" data-go="search" data-reset="1" data-country="japan"><h2>日本の旅</h2><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button></div><div class="hs" id="jpList"></div></div>
    <div id="trSec" hidden><div class="sh"><button class="shl" data-go="search" data-reset="1" data-style="transit"><h2>トランジット</h2><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button></div><div class="hs" id="trList"></div></div>
    <a class="fare press" href="#fare" style="margin-top:34px"><div><b>航空券、何月が安い？</b><small>61都市の月別最安値をチェック</small></div><div class="bars" id="fbars"></div></a>
    <div style="height:10px"></div>
  </div>
  <div id="folPane" hidden></div>
  <div id="boardPane" hidden></div>
</section>

<!-- 探す -->
<section class="view pt" id="search" hidden>
  <div class="sfrow"><label class="sfi"><svg width="17" height="17" viewBox="0 0 24 24" data-i="search"></svg><input id="q" placeholder="国・都市・キーワード" autocomplete="off"><button class="x" id="qx" type="button">✕</button></label><button class="aigo" data-go="ai" aria-label="AI相談" id="aiGo"></button></div>
  <p class="snum" id="snum"></p>
  <div class="seg" id="seg"><span class="knob"></span><button class="on" data-seg="0">リスト</button><button data-seg="1">地図</button></div>
  <div class="fl" id="filters"></div>
  <div id="results"></div>
</section>

<!-- 投稿 -->
<section class="view pt" id="post" hidden>
  <div class="lt lts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>投稿</div>
  <p class="sub" style="padding-top:6px">行った旅の旅程と費用を残して、次に行く人の参考に。</p>
  <div class="plist">
    <a class="pnew" href="#p"><span class="pi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19c3-1 4-5 8-5s5 3 8 2"/><circle cx="6" cy="7" r="2"/><circle cx="18" cy="9" r="2"/><path d="M8 7.5c3 .5 5 1 8 1.3"/></svg></span><span class="pt2"><b>旅程を投稿する</b><small>DAYごとの行程・費用・写真・航空券</small></span><span class="pa">→</span></a>
    <a class="pnew" href="#p-transit"><span class="pi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14l6-1 4-8h2l-1.5 7.5L19 12l2-2h1.5l-1 4.5"/><path d="M3 19h18"/></svg></span><span class="pt2"><b>トランジットを投稿する</b><small>乗り継ぎ空港での過ごし方・待ち時間</small></span><span class="pa">→</span></a>
  </div>
  <div id="draftSec" hidden><div class="sh" style="padding-top:34px"><h2>下書き <small id="draftN" class="num" style="font-size:13px;color:var(--muted);margin-left:4px"></small></h2></div><div id="draftList"></div></div>
  <div class="sh" style="padding-top:34px"><h2>公開までの流れ</h2></div>
  <ol class="flow"><li><b>書く</b><small>旅程・費用・写真を入力</small></li><li><b>運営が確認</b><small>運営が内容をチェック</small></li><li><b>公開</b><small>ホームと検索に載ります</small></li></ol>
</section>

<!-- 旅ひろば -->
<section class="view pt" id="sodan" hidden>
  <div class="shead"><div class="lt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3.5 4.5h12v9H8.5l-3.5 3v-3H3.5z"/><path d="M17.5 8.5h3v9h-2v3l-3.5-3H10v-2"/></svg>旅ひろば</div><a class="srule" href="#c-rules"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/></svg>ルール</a></div>
  <div id="sodanBody"></div>
  <a class="sfab" href="#c-new"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>投稿する</a>
</section>

<!-- AI -->
<section class="view pt" id="ai" hidden>
  <button class="back" data-go="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>探す</button>
  <div class="aihead"><div class="lt"><span id="aiSymH" class="aish"></span>AI相談</div><button id="aiNew" class="btn-g" hidden>新しい相談</button></div>
  <p class="sub" style="padding-top:4px">Tabistockの旅程記事と航空券の相場から答えます</p>
  <div id="aiIntro"><div class="aichips">
    <button>学生低予算ひとり旅のコツは？</button><button>治安がいい場所を旅行したい。</button><button>インド旅行で気をつけることは？</button><button>モンゴルでゲルに泊まりたい</button>
  </div></div>
  <div id="aiLog"></div>
  <div style="height:90px"></div>
</section>
<form class="aicmp" id="aiCmp" hidden><textarea id="aiIn" rows="1" maxlength="1000" placeholder="行き先・予算・日数などを相談"></textarea><button id="aiSend" aria-label="送信"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></form>

<!-- マイページ -->
<section class="view pt" id="me" hidden><div id="meBody"></div></section>

<!-- 保存した旅 -->
<section class="view pt" id="saved" hidden>
  <button class="back" data-go="me"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>マイページ</button>
  <div class="lt">保存した旅</div>
  <div id="savedList"></div>
</section>

<!-- 記事・プロフィール・DMなどは #pages に積み重ねて表示 -->
<div id="pages"></div>

<nav class="tab" id="tab"></nav>
<div class="ov" id="ov"></div>
<div class="bs" id="bs"></div>
<div class="toast" id="toast"></div>
</div>
<script type="module" src="./app.js?v=202611250004"></script>
</body>
</html>
