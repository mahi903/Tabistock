  <style>
    /* header floats transparently over the green hero, solid on scroll */
    .hd{position:fixed;background:transparent;backdrop-filter:none;box-shadow:none;padding:20px 6%}
    .hd .logo{color:#fff}
    .burger span{background:#fff}
    .hd.scrolled{background:rgba(246,239,228,.85);backdrop-filter:blur(16px);box-shadow:0 6px 24px rgba(0,0,0,.08);padding:14px 6%}
    .hd.scrolled .logo{color:#1f6f5b}
    .hd.scrolled .burger span{background:#1b2330}

    /* AIに相談ヒーロー（固定ヘッダーの下に緑地を敷く） */
    .ask-hero{position:relative;overflow:hidden;padding:108px 6% 40px;background:linear-gradient(150deg,#1f6f5b,#2f9e7f);color:#fff}
    .ask-hero::after{content:"";position:absolute;right:-90px;top:-90px;width:340px;height:340px;border-radius:50%;background:rgba(255,255,255,.07)}
    .ask-inner{position:relative;max-width:860px;margin:0 auto}
    .ask-eyebrow{margin:0 0 6px;font-family:"Manrope",sans-serif;font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#ffd9a0}
    .ask-inner h1{margin:0 0 10px;font-size:clamp(27px,4.2vw,42px);font-weight:900;letter-spacing:-.02em;color:#fff}
    .ask-note{margin:0 0 20px;font-size:14.5px;line-height:1.85;color:rgba(255,255,255,.92);max-width:620px}
    .ask-form{display:flex;gap:10px;align-items:stretch}
    .ask-form textarea{flex:1;border:none;border-radius:14px;padding:14px 16px;font-size:15px;font-family:inherit;line-height:1.6;resize:vertical;min-height:56px;color:#1b2330;box-shadow:inset 0 1px 3px rgba(0,0,0,.06)}
    .ask-form textarea:focus{outline:2px solid rgba(255,255,255,.7)}
    .ask-form button{flex-shrink:0;align-self:flex-end;border:none;border-radius:14px;padding:14px 24px;background:#fff;color:#1f6f5b;font-weight:800;font-size:15px;cursor:pointer;white-space:nowrap}
    .ask-form button:hover{opacity:.9}
    .ask-form button:disabled{opacity:.6;cursor:default}
    .ask-chips{margin:16px 0 0;display:flex;flex-wrap:wrap;gap:8px}
    .ask-chip{border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .ask-chip:hover{background:rgba(255,255,255,.22)}

    /* 回答エリア（クリーム地） */
    .ask-body{padding:26px 6% 60px;min-height:30vh}
    .ask-result{max-width:860px;margin:0 auto;background:#fff;border:1px solid #e7ddcb;border-radius:18px;padding:22px 22px;box-shadow:0 10px 30px rgba(20,30,25,.06)}
    .ask-result[hidden]{display:none}
    .ask-result-head{margin:0 0 12px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#1f6f5b}
    .ask-answer{font-size:15px;line-height:1.9;color:#283142}
    .ask-answer a{color:#1f6f5b;font-weight:700}
    .ask-refs{margin-top:18px;display:flex;flex-direction:column;gap:9px}
    .ask-refs-title{margin:0 0 2px;font-size:13px;font-weight:800;color:#1f6f5b}
    .ask-ref{display:flex;align-items:center;gap:11px;text-decoration:none;background:#f4f0e7;border:1px solid #e7ddcb;border-radius:12px;padding:12px 15px;color:#283142}
    .ask-ref:hover{background:#efe9dc}
    .ask-ref-ct{flex-shrink:0;font-size:11px;font-weight:800;color:#1f6f5b;background:#e3efe9;border-radius:999px;padding:3px 10px}
    .ask-ref-tt{flex:1;font-size:14px;font-weight:700;line-height:1.5}
    .ask-ref-ar{flex-shrink:0;color:#1f6f5b;font-weight:800}
    .ask-disclaimer{max-width:860px;margin:16px auto 0;font-size:12px;line-height:1.7;color:#8a8170;text-align:center}
    @media(max-width:768px){
      .ask-hero{padding:90px 6% 30px}
    }
    @media(max-width:600px){
      .ask-form{flex-direction:column}
      .ask-form button{align-self:stretch}
    }
  /* ボタンは角が少し丸い四角で統一（横長の丸ボタンはやめる） */
.ask-chip{border-radius:8px}
/* ── チャット形式（続けて質問できる） ── */
.chat{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.chat[hidden]{display:none}
.chat-head{display:flex;justify-content:space-between;align-items:center}
.chat-head p{margin:0;font-size:12px;font-weight:800;letter-spacing:.1em;color:#1f6f5b}
.chat-new{border:1px solid #d9cdb5;background:#fff;color:#4a4232;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.msg-u{align-self:flex-end;max-width:82%;background:#1f6f5b;color:#fff;border-radius:18px 18px 4px 18px;padding:11px 15px;font-size:15px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.msg-a{align-self:flex-start;width:100%;background:#fff;border:1px solid #e7ddcb;border-radius:4px 18px 18px 18px;padding:16px 18px;box-shadow:0 6px 18px rgba(20,30,25,.05)}
.msg-a .ask-answer{white-space:normal}
.msg-a .ask-refs{margin-top:14px}
.msg-a.typing .ask-answer{color:#8a8170}
.dots::after{content:"";animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"・"}50%{content:"・・"}75%{content:"・・・"}}
.composer{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(251,249,244,.96);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid #e7ddcb;padding:10px 4% calc(10px + env(safe-area-inset-bottom))}
.composer[hidden]{display:none}
.composer-in{max-width:860px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;border:1px solid #d9cdb5;border-radius:14px;padding:11px 14px;font-size:16px;font-family:inherit;line-height:1.5;resize:none;max-height:140px;color:#1b2330;background:#fff}
.composer textarea:focus{outline:2px solid rgba(31,111,91,.35)}
.composer button{flex-shrink:0;border:none;border-radius:12px;padding:12px 18px;background:#1f6f5b;color:#fff;font-weight:800;font-size:14.5px;cursor:pointer;font-family:inherit}
.composer button:disabled{opacity:.55;cursor:default}
body.chatting .ask-form,body.chatting .ask-chips{display:none}
body.chatting .ask-hero{padding-bottom:22px}
body.chatting .ask-note{margin-bottom:0}
body.chatting .ask-body{padding-bottom:130px}
/* アプリ（ホーム画面から起動）では下タブが入力欄を隠すので、チャット中はタブを隠す（DM画面と同じ） */
body.chatting .tabbar{display:none!important}
body.pwa.chatting{padding-bottom:0}
</style>

      <h1>AIに旅を相談</h1>

    </div>
    <p class="ask-disclaimer">回答はTabistockに投稿された旅程記事をもとにAIが生成しています。最新の現地情報や料金は、必ず公式サイト等でご確認ください。</p>

    <div class="composer-in">
      <textarea id="chatInput" rows="1" placeholder="続けて質問する"></textarea>
      <button type="button" id="chatSend">送信</button>
    </div>
  </div>

  <script>
  (function(){
    var hd=document.getElementById('hd');
    if(hd)addEventListener('scroll',function(){hd.classList.toggle('scrolled',scrollY>40)});
    var burger=document.getElementById('burger'),nav=document.getElementById('drawer'),ovl=document.getElementById('ovl'),dc=document.getElementById('dclose');
    if(burger&&nav&&ovl){
      var t=function(o){burger.classList.toggle('open',o);nav.classList.toggle('open',o);ovl.classList.toggle('open',o);document.body.style.overflow=o?'hidden':''};
      burger.addEventListener('click',function(){t(!nav.classList.contains('open'))});
      ovl.addEventListener('click',function(){t(false)});
      if(dc)dc.addEventListener('click',function(){t(false)});
      nav.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){t(false)})});
    }
  })();
  </script>
  <script>
  (function(){
    var dGo=document.getElementById('dGo'),dq=document.getElementById('dq');
    function go(){
      var p=new URLSearchParams();
      if(dq&&dq.value.trim())p.append('q',dq.value.trim());
      ['country','budget','days','style'].forEach(function(k){
        var el=document.getElementById('d-'+k);
        if(el&&el.value)p.append(k,el.value);
      });
      var qs=p.toString();
      window.location.href='search.html'+(qs?('?'+qs):'');
    }
    if(dGo)dGo.addEventListener('click',go);
    if(dq)dq.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();go();}});
  })();
  </script>
  <!-- AIに相談：公開記事をAIが読んで質問に答える（/api/ask）。チャット形式で続けて質問できる -->
  <script type="module">
    import { auth } from "./firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    // ログイン状態の初回復元を待つ（読み込み直後は currentUser が null のことがあるため）
    let authReady = false;
    const whenAuthReady = new Promise((resolve) => {
      const un = onAuthStateChanged(auth, (u) => { authReady = true; un(); resolve(u); });
    });
    const $ = (id) => document.getElementById(id);
    const input = $("askInput"), btn = $("askBtn"), chips = $("askChips");
    const chat = $("chat"), log = $("chatLog"), composer = $("composer");
    const chatInput = $("chatInput"), chatSend = $("chatSend"), chatNew = $("chatNew");
    const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

    // 会話はこの端末に保存（同じブラウザなら閉じても続きから）。アカウントごとに分ける
    const MAX_KEEP = 40;          // 端末に残す発言の数
    let conv = [];                // [{role:"user",content}, {role:"assistant",content,articles,fares}]
    let storeKey = null;
    function load() {
      try { const v = JSON.parse(localStorage.getItem(storeKey) || "[]"); return Array.isArray(v) ? v : []; }
      catch (e) { return []; }
    }
    function save() {
      if (!storeKey) return;
      try { localStorage.setItem(storeKey, JSON.stringify(conv.slice(-MAX_KEEP))); } catch (e) {}
    }

    function refsHTML(m) {
      const fareLink = m.fares
        ? `<a class="ask-ref" href="./flights.html"><span class="ask-ref-ct">航空券</span><span class="ask-ref-tt">相場カレンダーで月ごとの値段を見る</span><span class="ask-ref-ar">→</span></a>`
        : "";
      const refs = m.articles || [];
      const arts = refs.length
        ? `<p class="ask-refs-title">詳しくはこちらの記事を参考に</p>` + refs.map(a =>
            `<a class="ask-ref" href="./articles/view.html?id=${esc(a.id)}">` +
            (a.country ? `<span class="ask-ref-ct">${esc(a.country)}</span>` : "") +
            `<span class="ask-ref-tt">${esc(a.title)}</span><span class="ask-ref-ar">→</span></a>`).join("")
        : "";
      return fareLink + arts;
    }
    function bubble(m) {
      const el = document.createElement("div");
      if (m.role === "user") { el.className = "msg-u"; el.textContent = m.content; }
      else {
        el.className = "msg-a";
        el.innerHTML = `<div class="ask-answer">${m.html || esc(m.content).replace(/\n/g, "<br>")}</div>` +
          `<div class="ask-refs">${refsHTML(m)}</div>`;
      }
      return el;
    }
    function render() {
      const on = conv.length > 0;
      chat.hidden = !on; composer.hidden = !on;
      document.body.classList.toggle("chatting", on);
      log.innerHTML = "";
      conv.forEach((m) => log.appendChild(bubble(m)));
    }
    function scrollEnd() {
      requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }));
    }

    let busy = false;
    async function send(q) {
      q = (q || "").trim();
      if (!q || busy) return;
      const user = authReady ? auth.currentUser : await whenAuthReady;
      if (!user) {
        chat.hidden = false;
        log.innerHTML = "";
        log.appendChild(bubble({ role: "assistant", html: `相談機能を使うにはログインが必要です。<a href="account.html?next=ask.html">ログイン / 新規登録はこちら</a>` }));
        return;
      }
      busy = true; btn.disabled = true; chatSend.disabled = true;
      conv.push({ role: "user", content: q });
      render();
      const typing = bubble({ role: "assistant", html: `<span class="dots">AIが旅程記事を読んでいます</span>` });
      typing.classList.add("typing");
      log.appendChild(typing);
      scrollEnd();
      try {
        const idToken = await user.getIdToken();
        // AIには直近の会話だけ送る（長くなりすぎないように）
        const history = conv.slice(-20).map((m) => m.role === "user"
          ? { role: "user", content: m.content }
          : { role: "assistant", content: m.content, articleIds: (m.articles || []).map((a) => a.id), usedFares: !!m.fares });
        const res = await fetch("/api/ask", {
          method: "POST",
          headers: { "content-type": "application/json", "authorization": "Bearer " + idToken },
          body: JSON.stringify({ messages: history })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(String(res.status) + (data.detail ? "／" + data.detail : ""));
        conv.push({ role: "assistant", content: data.answer || "", articles: data.articles || [], fares: !!data.fares });
        save();
      } catch (e) {
        const code = /^\d+/.test(e && e.message) ? e.message : "通信";
        conv.pop(); // 失敗した質問は履歴に残さない（入力欄に戻す）
        render();
        // 最初の質問で失敗したときも、エラーが見えるようにチャット欄は出したままにする
        chat.hidden = false;
        if (conv.length) chatInput.value = q; else input.value = q;
        log.appendChild(bubble({ role: "assistant", html: `うまく相談できませんでした。少し時間をおいて、もう一度お試しください。<br><span style="font-size:12px;color:#8a8170">（エラー：${esc(code)}）</span>` }));
        busy = false; btn.disabled = false; chatSend.disabled = false;
        scrollEnd();
        return;
      }
      busy = false; btn.disabled = false; chatSend.disabled = false;
      render();
      scrollEnd();
    }

    // 最初の質問（上の入力欄・例のボタン）
    if (btn) btn.addEventListener("click", () => { const q = input.value; input.value = ""; send(q); });
    if (input) input.addEventListener("keydown", e => {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); btn.click(); }
    });
    if (chips) chips.addEventListener("click", e => {
      const c = e.target.closest(".ask-chip");
      if (c) send(c.textContent);
    });
    // 続けて質問（下の入力欄）
    chatSend.addEventListener("click", () => { const q = chatInput.value; chatInput.value = ""; chatInput.style.height = ""; send(q); });
    chatInput.addEventListener("keydown", e => {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); chatSend.click(); }
    });
    chatInput.addEventListener("input", () => { chatInput.style.height = "auto"; chatInput.style.height = Math.min(chatInput.scrollHeight, 140) + "px"; });
    // 新しい相談：会話を消して最初の画面に戻る
    chatNew.addEventListener("click", () => {
      conv = []; save(); render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      setTimeout(() => input && input.focus(), 300);
    });

    // ログインしていれば、この端末に残っている会話を復元
    whenAuthReady.then((u) => {
      if (!u) return;
      storeKey = "tabistock-ask-v1:" + u.uid;
      conv = load();
      if (conv.length) { render(); }
    });
  </script>
  <script type="module" src="./auth-status.js"></script>

</body>
