<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ログイン / 会員登録｜Tabistock</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#1f6f5b">
<script type="module" src="./auth-status.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",sans-serif;color:#182033;background:#f7f1e8;min-height:100vh}
  a{color:#1f6f5b}
  .top{display:flex;align-items:center;justify-content:space-between;padding:18px 6%}
  .logo{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",sans-serif;font-size:26px;font-weight:900;letter-spacing:-0.04em;color:#1f6f5b;text-decoration:none}
  .wrap{max-width:440px;margin:30px auto 60px;padding:0 20px}
  .card{background:#fff;border:1px solid #e7ddcb;border-radius:18px;padding:28px 26px;box-shadow:0 10px 30px rgba(0,0,0,.05)}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:#6c7787;font-size:13px;margin:0 0 22px}
  .tabs{display:flex;gap:8px;margin-bottom:22px}
  .tabs button{flex:1;padding:11px;border:1px solid #e7ddcb;background:#faf6ee;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;color:#6c7787;font-family:inherit}
  .tabs button.on{background:#1f6f5b;color:#fff;border-color:#1f6f5b}
  label{display:block;font-size:12px;font-weight:700;color:#6c7787;margin:14px 0 6px}
  input{width:100%;padding:12px 14px;border:1px solid #e7ddcb;border-radius:12px;font-size:15px;font-family:inherit;outline:none;background:#fff;color:#182033}
  input:focus{border-color:#1f6f5b}
  .hint{font-size:11px;color:#9aa2af;margin:5px 0 0}
  .btn{width:100%;margin-top:20px;padding:13px;border:none;border-radius:999px;background:#e2683b;color:#fff;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
  .btn:disabled{opacity:.55;cursor:default}
  .msg{margin-top:16px;font-size:13px;padding:11px 14px;border-radius:10px;display:none}
  .msg.err{display:block;background:#fdecec;color:#b53d3d;border:1px solid #f3c9c9}
  .msg.ok{display:block;background:#e9f5ef;color:#1f6f5b;border:1px solid #bfe3d3}
  .hide{display:none}
  .me{background:transparent;border:none;border-radius:0;padding:0;text-align:center}
  .me .nick{font-size:20px;font-weight:800;margin:6px 0}
  .me .email{color:#6c7787;font-size:13px;margin:0 0 18px}
  .me .actions{display:flex;flex-direction:column;gap:10px}
  .me .actions a,.me .actions button{display:flex;align-items:center;justify-content:center;width:100%;padding:12px 14px;border-radius:4px;font-size:13px;font-weight:700;line-height:1;text-decoration:none;text-align:center;cursor:pointer;font-family:inherit;border:none}
  .a-main{background:#e2683b;color:#fff}
  .a-ghost{background:#faf6ee;color:#1f6f5b;border:1.5px solid #1f6f5b !important}
  .sub-link{display:block;text-align:right;margin-top:12px;font-size:12px;font-weight:700;color:#1f6f5b;text-decoration:underline;text-underline-offset:3px}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;margin-top:8px}
  .badge.warn{background:#fff3e6;color:#c4691f}
  .badge.ok{background:#e9f5ef;color:#1f6f5b}
  /* マイページ */
  .me{text-align:left}
  .profile{display:flex;align-items:center;gap:16px}
  .avatar-wrap{position:relative;flex-shrink:0}
  .avatar{width:84px;height:84px;border-radius:50%;background:#1f6f5b;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;font-weight:800;border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.12)}
  .avatar-edit{position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:#e2683b;color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;padding:0;line-height:1}
  .profile .pinfo{min-width:0;flex:1}
  .profile .pinfo .nick{font-size:20px;font-weight:800;margin:0 0 2px}
  .profile .pinfo .email{color:#6c7787;font-size:13px;margin:0;word-break:break-all}
  /* フォロー統計 */
  .stats{display:flex;gap:8px;margin-top:14px}
  .stats .stat{flex:1;text-align:center;background:#faf6ee;border:1px solid #e7ddcb;border-radius:12px;padding:9px 4px;font:inherit;color:inherit}
  button.stat{cursor:pointer;transition:background .15s}
  button.stat:hover{background:#f1ead9}
  .stats .stat strong{display:block;font-size:18px;font-weight:800;color:#182033;line-height:1.15}
  .stats .stat span{font-size:11.5px;color:#6c7787}
  /* フォロー一覧モーダル */
  .fmodal{position:fixed;inset:0;background:rgba(24,32,51,.45);display:none;align-items:flex-end;justify-content:center;z-index:1000}
  .fmodal.open{display:flex}
  .fmodal .sheet{background:#fff;width:100%;max-width:480px;max-height:78vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:fsheet .22s ease}
  @media(min-width:520px){.fmodal{align-items:center}.fmodal .sheet{border-radius:18px}}
  @keyframes fsheet{from{transform:translateY(20px);opacity:.6}to{transform:none;opacity:1}}
  .fmodal .fhead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid #eee3d2}
  .fmodal .fhead h3{margin:0;font-size:15px;font-weight:800}
  .fmodal .fclose{background:none;border:none;font-size:22px;line-height:1;color:#6c7787;cursor:pointer;padding:0 4px}
  .fmodal .flist{overflow:auto;padding:8px 0}
  .frow{display:flex;align-items:center;gap:12px;padding:10px 18px;text-decoration:none;color:inherit}
  .frow:hover{background:#faf6ee}
  .frow .fav{width:42px;height:42px;border-radius:50%;background:#1f6f5b;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;font-weight:800;flex-shrink:0}
  .frow .fnk{font-size:14px;font-weight:700}
  .fempty{color:#6c7787;font-size:13px;text-align:center;padding:34px 16px}
  .section-title{font-size:15px;font-weight:800;margin:26px 0 12px;display:flex;align-items:center;justify-content:space-between}
  .section-title .count{font-size:12px;color:#6c7787;font-weight:700}
  /* 投稿の種類タブ（Instagram のプロフィールのアイコンタブ風） */
  .ptabs{display:flex;border-bottom:1px solid #e7ddcb;margin:24px 0 12px}
  .ptab{flex:1;background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 0 9px;color:#a3a9b3;cursor:pointer;position:relative;display:flex;justify-content:center}
  .ptab.on{color:#182033;border-bottom-color:#182033}
  .ptab-dot{position:absolute;top:7px;left:calc(50% + 8px);width:7px;height:7px;border-radius:50%;background:#e0245e}
  .ptab-sub{font-size:12.5px;font-weight:800;color:#6c7787;margin:4px 0 8px;display:flex;align-items:center;gap:6px}
  .posts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:480px){.posts{grid-template-columns:1fr 1fr;gap:10px}}
  .pcard{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #e7ddcb;border-radius:14px;overflow:hidden;transition:box-shadow .15s}
  .pcard:hover{box-shadow:0 6px 18px rgba(0,0,0,.08)}
  .pcard .pthumb{width:100%;height:108px;background-size:cover;background-position:center;background-color:#e7ddcb}
  .pcard .pbody{padding:10px 12px}
  .pcard .ptitle{font-size:13.5px;font-weight:700;margin:0 0 7px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  /* ステータスは色付きの点＋文字だけ（バッジ型にしない） */
  .pmeta{display:flex;align-items:center;gap:8px;min-height:28px}
  .pstat{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:#6c7787;white-space:nowrap}
  .pstat::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .s-published{color:#1f6f5b}
  .s-pending{color:#c4691f}
  .s-rejected{color:#b53d3d}
  .s-draft,.s-hidden{color:#8a919c}
  .pcollab{font-size:11.5px;color:#6c7787;white-space:nowrap}
  .pmenu{margin-left:auto;width:32px;height:28px;border:none;background:none;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#182033;cursor:pointer;padding:0}
  .pmenu:active{background:#f1ece2}
  /* ボトムシート（Instagram の「…」メニュー風） */
  .msheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:300;opacity:0;transition:opacity .2s}
  .msheet-bg.open{opacity:1}
  /* フォロー一覧の .fmodal .sheet と名前がぶつからないよう msheet にする */
  .msheet{position:fixed;left:0;right:0;bottom:0;z-index:301;background:#f4f4f6;border-radius:16px 16px 0 0;padding:8px 12px calc(14px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;transform:translateY(100%);transition:transform .22s ease}
  .msheet.open{transform:none}
  .sheet-grip{width:36px;height:4px;border-radius:2px;background:#cfd1d6;margin:2px auto 10px}
  .sheet-title{font-size:13px;color:#6c7787;text-align:center;margin:0 8px 10px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .sheet-group{background:#fff;border-radius:12px;overflow:hidden;margin-bottom:10px}
  .sheet-item{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border:none;background:none;font:inherit;font-size:15px;color:#182033;text-align:left;text-decoration:none;cursor:pointer}
  .sheet-item + .sheet-item{border-top:1px solid #eeeef1}
  .sheet-item:active{background:#f4f4f6}
  .sheet-item svg{flex-shrink:0}
  .sheet-item.danger{color:#e0245e}
  .sheet-item .si-sub{margin-left:auto;font-size:12.5px;color:#9aa2af}
  .sheet-person{display:flex;align-items:center;gap:12px;padding:12px 16px}
  .sheet-person + .sheet-person{border-top:1px solid #eeeef1}
  .sheet-person img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:#e7ddcb}
  .sheet-person .sp-name{font-size:14.5px;font-weight:700}
  .sheet-person .sp-role{margin-left:auto;font-size:12px;color:#9aa2af}
  .sheet-note{font-size:12px;color:#9aa2af;text-align:center;margin:0 0 10px}
  .pacts{display:flex;gap:6px;width:100%}
  .pbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border-radius:8px;padding:6px 10px;white-space:nowrap;cursor:pointer;background:#fff;border:1px solid #d4d8de;color:#5b6470}
  .pbtn:disabled{opacity:.5;cursor:default}
  .pbtn-ok{color:#fff;border-color:#1f6f5b;background:#1f6f5b}
  .invite-from{font-size:12px;color:#6c7787;margin:0 0 4px}
  .posts-empty{grid-column:1/-1;color:#6c7787;font-size:13px;text-align:center;padding:26px 16px;border:1px dashed #e7ddcb;border-radius:14px}
  /* 設定行（トグル） */
  .setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid #eee3d2;border-bottom:1px solid #eee3d2}
  .setlabel{font-size:14px;font-weight:700;color:#182033;line-height:1.3}
  .setnote{font-size:11px;color:#9aa2af;margin-top:2px}
  .toggle{position:relative;width:46px;height:27px;border-radius:999px;background:#d4cdbe;border:none;cursor:pointer;padding:0;flex-shrink:0;transition:background .2s}
  .toggle .knob{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
  .toggle.on{background:#1f6f5b}
  .toggle.on .knob{transform:translateX(19px)}
  .toggle:disabled{opacity:.45;cursor:default}
</style>
</head>
<body>
  <div class="top">
    <a class="logo" href="./index.html">Tabistock</a>
    <a href="./index.html" style="font-size:13px;text-decoration:none;color:#6c7787">← トップへ</a>
  </div>

  <div class="wrap">
    <!-- 認証判定中（ログイン画面のチラ見え防止） -->
    <div id="authLoading" style="text-align:center;padding:60px 16px;color:#9aa2af;font-size:13px">読み込み中…</div>

    <!-- 未ログイン -->
    <div class="card hide" id="authCard">
      <h1 id="formTitle">ログイン</h1>
      <p class="sub">旅程を投稿するにはアカウントが必要です。</p>

      <div class="tabs">
        <button id="tabLogin" class="on" type="button">ログイン</button>
        <button id="tabSignup" type="button">新規登録</button>
      </div>

      <!-- ニックネーム（登録時のみ） -->
      <div id="nickWrap" class="hide">
        <label for="nickname">ニックネーム（投稿者名）</label>
        <input id="nickname" type="text" autocomplete="nickname">
        <p class="hint">記事に表示される名前です。半角英数字推奨（あとで記事のID生成にも使います）。</p>
      </div>

      <label for="email">メールアドレス</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com">

      <label for="password">パスワード</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="6文字以上">

      <button class="btn" id="submitBtn" type="button">ログイン</button>
      <p id="forgotWrap" style="text-align:center;margin:12px 0 0;font-size:13px">
        <a href="#" id="forgotLink" style="color:#1f6f5b;text-decoration:underline">パスワードを忘れた方</a>
      </p>
      <div class="msg" id="msg"></div>
    </div>

    <!-- ログイン済み（マイページ） -->
    <div class="me hide" id="meCard">
      <div class="profile">
        <div class="avatar-wrap">
          <div class="avatar" id="meAvatar">—</div>
          <button class="avatar-edit" id="avatarEditBtn" type="button" title="アイコンを変更">✎</button>
          <input type="file" id="avatarInput" accept="image/*" class="hide">
        </div>
        <div class="pinfo">
          <p class="nick" id="meNick">—</p>
          <p class="email" id="meEmail">—</p>
          <div id="verifyBadge"></div>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><strong id="postStat">0</strong><span>投稿</span></div>
        <button class="stat" id="followerStat" type="button"><strong id="followerCount">0</strong><span>フォロワー</span></button>
        <button class="stat" id="followingStat" type="button"><strong id="followingCount">0</strong><span>フォロー</span></button>
      </div>

      <div class="actions" style="margin-top:18px;flex-direction:row;gap:10px">
        <button class="a-ghost" id="editToggleBtn" type="button" style="flex:1">プロフィールを編集</button>
        <a class="a-main" href="./post.html" style="flex:1">投稿する</a>
      </div>
      <a class="sub-link" href="./post-transit.html">トランジット記事を投稿する →</a>
      <div class="msg" id="avatarMsg" style="margin-top:12px"></div>

      <!-- プロフィール編集（ボタンで開閉・初期は非表示） -->
      <div id="editSection" class="hide">
        <div class="section-title">プロフィールを編集</div>
        <label for="editNick">ユーザーネーム（投稿者名）</label>
        <input id="editNick" type="text" maxlength="30" autocomplete="nickname">
        <p class="hint">記事や投稿者カードに表示される名前です。他の人と同じ名前は使えません。</p>
        <label for="bio">ひとこと自己紹介</label>
        <input id="bio" type="text" maxlength="60" placeholder="例：学生バックパッカー。アジア中心に旅してます">
        <label for="instagram">Instagram（任意）</label>
        <input id="instagram" type="text" placeholder="ユーザー名 または URL（例：mahiro.9.3）">
        <p class="hint">ここで設定した内容が、あなたが投稿した記事の「執筆者カード」に表示されます。</p>
        <button class="btn" id="saveProfileBtn" type="button" style="margin-top:14px">変更を保存</button>
        <div class="msg" id="profileMsg" style="margin-top:12px"></div>
      </div>

      <nav class="ptabs" id="ptabs" role="tablist">
        <button type="button" class="ptab on" data-tab="trips" role="tab" aria-label="旅程" title="旅程">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><rect x="13.5" y="13.5" width="7" height="7" rx="1"/></svg>
        </button>
        <button type="button" class="ptab" data-tab="transit" role="tab" aria-label="トランジット" title="トランジット">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
        </button>
        <button type="button" class="ptab" data-tab="collab" role="tab" aria-label="共同投稿" title="共同投稿">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c0-3.2 2.5-5.5 5.5-5.5s5.5 2.3 5.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 13.7c2.8-.3 5 1.6 5 4.8"/></svg>
          <span class="ptab-dot" id="inviteDot" hidden></span>
        </button>
        <button type="button" class="ptab" data-tab="saved" role="tab" aria-label="保存した投稿" title="保存した投稿">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M6 3.5h12v17l-6-4.5-6 4.5z"/></svg>
        </button>
      </nav>
      <div id="ppanels">
        <div data-panel="trips"><div id="myPosts" class="posts"></div></div>
        <div data-panel="transit" hidden><div id="transitPosts" class="posts"></div></div>
        <div data-panel="collab" hidden>
          <div id="collabInvitesWrap" hidden>
            <div class="ptab-sub" id="collab">招待 <span class="count" id="inviteCount"></span></div>
            <div id="collabInvites" class="posts"></div>
            <div class="ptab-sub" style="margin-top:16px">共同投稿</div>
          </div>
          <div id="collabPosts" class="posts"></div>
        </div>
        <div data-panel="saved" hidden><div id="savedPosts" class="posts"></div></div>
      </div>

      <div class="setrow" style="margin-top:26px">
        <div>
          <div class="setlabel">プッシュ通知</div>
          <div class="setnote" id="pushNote"></div>
        </div>
        <button class="toggle" id="pushToggle" type="button" role="switch" aria-checked="false" aria-label="プッシュ通知の切り替え"><span class="knob"></span></button>
      </div>
      <div class="msg" id="pushMsg" style="margin-top:8px"></div>

      <p class="hint" id="uidLine" style="margin-top:18px;word-break:break-all"></p>

      <div class="actions" style="margin-top:18px">
        <button class="a-ghost" id="logoutBtn" type="button">ログアウト</button>
      </div>
    </div>
  </div>

  <!-- フォロー/フォロワー一覧モーダル -->
  <div class="fmodal" id="fModal">
    <div class="sheet">
      <div class="fhead">
        <h3 id="fTitle">フォロー</h3>
        <button class="fclose" id="fClose" type="button" aria-label="閉じる">×</button>
      </div>
      <div class="flist" id="fList"></div>
    </div>
  </div>

<script type="module">
import { auth, db, storage } from "./firebase-config.js";
import {
  createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut,
  onAuthStateChanged, updateProfile, sendEmailVerification, sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, setDoc, getDoc, updateDoc, deleteDoc, serverTimestamp, collection, query, where, getDocs, getCountFromServer, arrayUnion, arrayRemove }

function jpError(code){
  const map = {
    "auth/invalid-email": "メールアドレスの形式が正しくありません。",
    "auth/missing-password": "パスワードを入力してください。",
    "auth/weak-password": "パスワードは6文字以上にしてください。",
    "auth/email-already-in-use": "このメールアドレスは既に登録されています。ログインしてください。",
    "auth/invalid-credential": "メールアドレスかパスワードが違います。",
    "auth/user-not-found": "アカウントが見つかりません。新規登録してください。",
    "auth/wrong-password": "パスワードが違います。",
    "auth/too-many-requests": "試行回数が多すぎます。しばらく待ってから再度お試しください。",
    "auth/network-request-failed": "通信エラーです。接続を確認してください。"
  };
  return map[code] || ("エラー：" + code);
}

$("submitBtn").onclick = async () => {
  const email = $("email").value.trim();
  const password = $("password").value;
  const nickname = $("nickname").value.trim();
  if(!email || !password){ showMsg("メールアドレスとパスワードを入力してください。", "err"); return; }
  if(mode==="signup" && !nickname){ showMsg("ニックネームを入力してください。", "err"); return; }

  $("submitBtn").disabled = true;
  showMsg(mode==="login" ? "ログイン中…" : "登録中…", "ok");
  try{
    if(mode==="signup"){
      // ニックネーム重複チェック（簡易）
      const dup = await getDocs(query(collection(db, "publicProfiles"), where("nickname", "==", nickname)));
      if(!dup.empty){
        showMsg("このニックネームは既に使われています。別の名前にしてください。", "err");
        $("submitBtn").disabled = false;
        return;
      }
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await updateProfile(cred.user, { displayName: nickname });
      await setDoc(doc(db, "users", cred.user.uid), {
        nickname, email, createdAt: serverTimestamp()
      });
      await setDoc(doc(db, "publicProfiles", cred.user.uid), {
        nickname, createdAt: serverTimestamp()
      }, { merge: true });
      try { await sendEmailVerification(cred.user); } catch(e){}
      await signOut(auth); // 認証が済むまでログイン状態にしない
      setMode("login");
      showMsg("確認メールを送信しました。メール内のリンクを開いて認証を完了してから、ログインしてください。", "ok");
    }else{
      const cred = await signInWithEmailAndPassword(auth, email, password);
      if(!cred.user.emailVerified){
        try { await sendEmailVerification(cred.user); } catch(e){} // 確認メールを再送
        await signOut(auth);
        showMsg("メールアドレスが未確認です。確認メールのリンクを開いて認証を完了してください。（確認メールを再送しました）", "err");
        return;
      }
    }
  }catch(err){
    showMsg(jpError(err.code), "err");
  }finally{
    $("submitBtn").disabled = false;
  }
};

/* ===== プッシュ通知（トグル） ===== */
const PUSH_PREF = "tabistock_push"; // この端末での希望状態 "on" | "off"
function showPushMsg(text, kind){
  const el = $("pushMsg");
  el.className = "msg" + (kind ? " "+kind : "");
  el.textContent = text;
}
function setToggle(on){
  const t = $("pushToggle"); if(!t) return;
  t.classList.toggle("on", !!on);
  t.setAttribute("aria-checked", on ? "true" : "false");
}
async function updatePushUI(){
  const t = $("pushToggle"); if(!t) return;
  if(!(await isPushSupported())){
    t.disabled = true; setToggle(false);
    $("pushNote").textContent = "この端末は通知に対応していません";
    return;
  }
  const perm = (typeof Notification !== "undefined") ? Notification.permission : "denied";
  if(perm === "denied"){
    t.disabled = true; setToggle(false);
    $("pushNote").textContent = "ブラウザ設定で通知がブロックされています";
    return;
  }
  t.disabled = false;
  $("pushNote").textContent = "いいね・コメント・フォローをお知らせ";
  const on = (perm === "granted") && (localStorage.getItem(PUSH_PREF) !== "off");
  setToggle(on);
}
$("pushToggle").onclick = async () => {
  const t = $("pushToggle");
  const turningOn = !t.classList.contains("on");
  t.disabled = true;
  showPushMsg("設定中…", "ok");
  try{
    if(turningOn){
      await enablePush();
      localStorage.setItem(PUSH_PREF, "on");
      setToggle(true);
      showPushMsg("通知をオンにしました。", "ok");
    }else{
      await disablePush();
      localStorage.setItem(PUSH_PREF, "off");
      setToggle(false);
      showPushMsg("通知をオフにしました。", "ok");
    }
  }catch(e){
    showPushMsg(e.message || "設定に失敗しました。", "err");
    await updatePushUI(); // 失敗時は実状態に戻す
  }finally{
    const denied = (typeof Notification !== "undefined") && Notification.permission === "denied";
    t.disabled = denied || !(await isPushSupported());
  }
};

// 正方形に中央クロップして縮小
function resizeSquare(file, size){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(img.width, img.height);
      const sx = (img.width - s)/2, sy = (img.height - s)/2;
      const c = document.createElement("canvas");
      c.width = size; c.height = size;
      c.getContext("2d").drawImage(img, sx, sy, s, s, 0, 0, size, size);
      c.toBlob(b => b ? resolve(b) : reject(new Error("画像変換に失敗しました")), "image/jpeg", 0.85);
    };
    img.onerror = () => reject(new Error("画像を読み込めませんでした"));
    img.src = URL.createObjectURL(file);
  });
}
$("avatarEditBtn").onclick = () => $("avatarInput").click();
$("avatarInput").onchange = async () => {
  const f = $("avatarInput").files[0]; if(!f) return;
  const user = auth.currentUser; if(!user){ return; }
  showAvatarMsg("アイコンをアップロード中…", "ok");
  try{
    const blob = await resizeSquare(f, 256);
    const r = sRef(storage, `avatars/${user.uid}/avatar.jpg`);
    await uploadBytes(r, blob, { contentType: "image/jpeg" });
    const url = await getDownloadURL(r);
    await updateProfile(user, { photoURL: url });
    await setDoc(doc(db, "users", user.uid), { photoURL: url }, { merge: true });
    await setDoc(doc(db, "publicProfiles", user.uid), { photoURL: url }, { merge: true });
    setAvatar(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(), null); // キャッシュ回避
    showAvatarMsg("アイコンを更新しました。", "ok");
  }catch(err){
    console.error(err);
    showAvatarMsg("アップロードに失敗しました：" + (err.message || err), "err");
  }finally{
    $("avatarInput").value = "";
  }
};

const STATUS_LABEL = { published:"公開中", pending:"承認待ち", rejected:"却下", draft:"下書き", hidden:"非表示" };
const ICON_MENU = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h16M4 15h16"/></svg>';
const postCache = {};   // id -> 記事データ（メニューで使う）
function renderPost(d, own, collab){
  const thumb = d.thumbUrl || (d.heroUrls && d.heroUrls[0]) || "";
  const st = STATUS_LABEL[d.status] ? d.status : "pending";
  if(own) postCache[d.id] = { ...d, _collab: !!collab };
  return `<div class="pcard">
    <a href="./articles/view.html?id=${esc(d.id)}" style="text-decoration:none;color:inherit;display:block">
      <div class="pthumb" style="background-image:url('${esc(thumb)}')"></div>
      <div class="pbody" style="padding-bottom:4px"><p class="ptitle" style="margin-bottom:0">${esc(d.title||"(無題)")}</p></div>
    </a>
    <div class="pbody" style="padding-top:0;padding-bottom:6px">
      <div class="pmeta">${own ? `<span class="pstat s-${st}">${STATUS_LABEL[st]}</span>${collab ? `<span class="pcollab">共同投稿</span>` : ""}<button type="button" class="pmenu" data-menu="${esc(d.id)}" aria-label="メニュー">${ICON_MENU}</button>` : ""}</div>
    </div>
  </div>`;
}
async function loadMyPosts(uid){
  const boxes = { trips: $("myPosts"), transit: $("transitPosts"), collab: $("collabPosts") };
  Object.values(boxes).forEach(b => { b.innerHTML = `<p class="posts-empty">読み込み中…</p>`; });
  try{
    // 自分が投稿した記事 ＋ 共同投稿者として参加している記事
    const [snap, coSnap] = await Promise.all([
      getDocs(query(collection(db, "articles"), where("authorId", "==", uid))),
      getDocs(query(collection(db, "articles"), where("coAuthorIds", "array-contains", uid))).catch(e => { console.warn("共同投稿の読み込みに失敗:", e); return null; })
    ]);
    const docs = [];
    snap.forEach(s => docs.push({ id: s.id, ...s.data() }));
    if(coSnap) coSnap.forEach(s => { if(!docs.some(x => x.id === s.id)) docs.push({ id: s.id, ...s.data(), _collab: true }); });
    docs.sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
    $("postStat").textContent = docs.filter(d => d.status === "published").length;
    // ①旅程・②トランジット＝自分が投稿主の記事、③共同投稿＝複数人の記事すべて（自分が投稿主のものも含む）
    const owned = docs.filter(d => !d._collab);
    const lists = {
      trips:   owned.filter(d => d.type !== "transit"),
      transit: owned.filter(d => d.type === "transit"),
      collab:  docs.filter(d => d._collab || (d.coAuthorIds || []).length || (d.coAuthorInvites || []).length)
    };
    const empty = {
      trips:   `まだ旅程がありません。<br><a href="./post.html">最初の旅程を投稿する →</a>`,
      transit: `まだトランジット記事がありません。<br><a href="./post-transit.html">トランジット記事を投稿する →</a>`,
      collab:  `共同投稿はまだありません。<br>投稿の編集画面から、一緒に旅した友達を招待できます。`
    };
    for(const k in boxes){
      boxes[k].innerHTML = lists[k].length
        ? lists[k].map(d => renderPost(d, true, !!d._collab)).join("")
        : `<p class="posts-empty">${empty[k]}</p>`;
    }
  }catch(err){
    console.error(err);
    Object.values(boxes).forEach(b => { b.innerHTML = `<p class="posts-empty">読み込みエラー：${esc(err.message||err)}</p>`; });
  }
}

// 記事の操作（非表示／再公開／削除／抜ける／譲る）。再公開は承認不要で即公開に戻す。
async function runPostAction(act, id){
  const uid = auth.currentUser && auth.currentUser.uid;
  if(!id || !uid) return;
  if(act === "delete" && !confirm("この投稿を削除しますか？この操作は取り消せません。")) return;
  if(act === "leave" && !confirm("この共同投稿から抜けますか？あなたのプロフィールに表示されなくなり、編集もできなくなります。")) return;
  if(act === "handover"){ await handOver(id, uid); return; }
  try{
    if(act === "hide"){
      await updateDoc(doc(db, "articles", id), { status: "hidden", updatedAt: serverTimestamp() });
    }else if(act === "show"){
      await updateDoc(doc(db, "articles", id), { status: "published", updatedAt: serverTimestamp() });
    }else if(act === "delete"){
      await deleteDoc(doc(db, "articles", id));
    }else if(act === "leave"){
      await updateDoc(doc(db, "articles", id), { coAuthorIds: arrayRemove(uid) });
    }
    await loadMyPosts(uid);
  }catch(err){
    console.error(err);
    alert("操作に失敗しました：" + (err.message || err));
  }
}

const sheetBg = document.createElement("div"); sheetBg.className = "msheet-bg"; sheetBg.hidden = true;
const sheet = document.createElement("div"); sheet.className = "msheet"; sheet.hidden = true;
sheet.setAttribute("role", "dialog"); sheet.setAttribute("aria-modal", "true");
document.body.append(sheetBg, sheet);
function closeSheet(){
  sheet.classList.remove("open"); sheetBg.classList.remove("open");
  setTimeout(() => { sheet.hidden = true; sheetBg.hidden = true; }, 220);
}
sheetBg.addEventListener("click", closeSheet);
function showSheet(html){
  sheet.innerHTML = `<div class="sheet-grip"></div>` + html;
  sheet.hidden = false; sheetBg.hidden = false;
  requestAnimationFrame(() => { sheet.classList.add("open"); sheetBg.classList.add("open"); });
}
function openPostSheet(id){
  const d = postCache[id]; if(!d) return;
  const collab = d._collab;
  const people = (d.coAuthorIds || []).length + (d.coAuthorInvites || []).length;
  const editPage = d.type === "transit" ? "./post-transit.html" : "./post.html";
  const items = [];
  items.push(`<a class="sheet-item" href="${editPage}?edit=${esc(id)}">${ICONS.edit}編集</a>`);
  if(people || collab) items.push(`<button type="button" class="sheet-item" data-sact="people">${ICONS.people}共同投稿者<span class="si-sub">${people + (collab ? 1 : 0)}人</span></button>`);
  if(!collab && (d.coAuthorIds || []).length) items.push(`<button type="button" class="sheet-item" data-sact="handover">${ICONS.swap}投稿者を譲る</button>`);
  if(d.status === "published") items.push(`<button type="button" class="sheet-item" data-sact="hide">${ICONS.hide}非表示にする</button>`);
  if(d.status === "hidden") items.push(`<button type="button" class="sheet-item" data-sact="show">${ICONS.show}再公開する</button>`);
  const danger = collab
    ? `<button type="button" class="sheet-item danger" data-sact="leave">${ICONS.leave}共同投稿から抜ける</button>`
    : `<button type="button" class="sheet-item danger" data-sact="delete">${ICONS.trash}削除</button>`;
  showSheet(`<p class="sheet-title">${esc(d.title || "(無題)")}</p>
    <div class="sheet-group">${items.join("")}</div>
    <div class="sheet-group">${danger}</div>`);
  sheet.onclick = async (e) => {
    const b = e.target.closest("[data-sact]"); if(!b) return;
    const act = b.dataset.sact;
    if(act === "people"){ openPeopleSheet(id); return; }
    if(act === "back"){ openPostSheet(id); return; }
    closeSheet();
    await runPostAction(act, id);
  };
}
const DEF_PERSON = "data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22%23e7ddcb%22%2F%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2240%22%20r%3D%2218%22%20fill%3D%22%23b9ad95%22%2F%3E%3Cpath%20d%3D%22M20%2086c0-17%2013-28%2030-28s30%2011%2030%2028z%22%20fill%3D%22%23b9ad95%22%2F%3E%3C%2Fsvg%3E";
window.DEF_PERSON = DEF_PERSON;   // onerror 属性から参照するため
// 共同投稿者の一覧（招待・変更は編集画面から）
async function openPeopleSheet(id){
  const d = postCache[id]; if(!d) return;
  const rows = [[d.authorId, "投稿者"], ...(d.coAuthorIds || []).map(u => [u, "共同投稿者"]), ...(d.coAuthorInvites || []).map(u => [u, "招待中"])];
  const profs = await Promise.all(rows.map(async ([u]) => {
    try{ const p = await getDoc(doc(db, "publicProfiles", u)); return p.exists() ? p.data() : {}; }catch(e){ return {}; }
  }));
  const me = auth.currentUser && auth.currentUser.uid;
  sheet.innerHTML = `<div class="sheet-grip"></div>
    <div class="sheet-group"><button type="button" class="sheet-item" data-sact="back">${ICONS.back}共同投稿者</button></div>
    <div class="sheet-group">${rows.map(([u, role], i) => `<a class="sheet-person" href="./user.html?uid=${esc(u)}" style="text-decoration:none;color:inherit">
      <img src="${esc(profs[i].photoURL || DEF_PERSON)}" alt="" onerror="this.src=DEF_PERSON">
      <span class="sp-name">${esc(profs[i].nickname || "旅人")}${u === me ? "（あなた）" : ""}</span><span class="sp-role">${role}</span></a>`).join("")}</div>
    ${d._collab ? "" : `<p class="sheet-note">招待や取り消しは「編集」画面からできます</p>`}`;
}

// 投稿者を共同投稿者に譲る。自分は共同投稿者として残る（あとで「抜ける」こともできる）。
async function handOver(id, uid){
  try{
    const snap = await getDoc(doc(db, "articles", id));
    if(!snap.exists()) return;
    const d = snap.data();
    const ids = Array.isArray(d.coAuthorIds) ? d.coAuthorIds : [];
    if(!ids.length) return;
    const profs = await Promise.all(ids.map(async u => {
      try{ const p = await getDoc(doc(db, "publicProfiles", u)); return (p.exists() && p.data().nickname) || "旅人"; }
      catch(e){ return "旅人"; }
    }));
    let idx = 0;
    if(ids.length > 1){
      const ans = prompt("誰に投稿者を譲りますか？番号を入力してください。\n" + profs.map((n, i) => `${i+1}. ${n}`).join("\n"));
      if(ans == null) return;
      idx = parseInt(ans, 10) - 1;
      if(!(idx >= 0 && idx < ids.length)){ alert("番号が正しくありません。"); return; }
    }
    const to = ids[idx], toName = profs[idx];
    if(!confirm(`「${d.title || "(無題)"}」の投稿者を ${toName} さんに譲りますか？\n\nあなたは共同投稿者として残り、編集は続けられます（完全に外れたいときは、あとで「抜ける」を押してください）。\n記事の削除や招待の管理は ${toName} さんしかできなくなります。`)) return;
    await updateDoc(doc(db, "articles", id), {
      authorId: to,
      authorNickname: toName,
      coAuthorIds: [...ids.filter(u => u !== to), uid]
    });
    sendNotification({ toUid: to, type: "handover", articleId: id, articleTitle: d.title || "" });
    await loadMyPosts(uid);
  }catch(err){
    console.error(err);
    alert("操作に失敗しました：" + (err.message || err));
  }
}

// 共同投稿の招待（Instagram の「コラボ」と同じ。承認すると投稿者欄に並び、編集もできる）
async function loadCollabInvites(uid){
  const wrap = $("collabInvitesWrap"), box = $("collabInvites");
  try{
    const snap = await getDocs(query(collection(db, "articles"), where("coAuthorInvites", "array-contains", uid)));
    const docs = [];
    snap.forEach(s => docs.push({ id: s.id, ...s.data() }));
    wrap.hidden = !docs.length;
    $("inviteCount").textContent = docs.length ? `${docs.length}件` : "";
    box.innerHTML = docs.map(d => {
      const thumb = d.thumbUrl || (d.heroUrls && d.heroUrls[0]) || "";
      return `<div class="pcard">
    <a href="./articles/view.html?id=${esc(d.id)}" style="text-decoration:none;color:inherit;display:block">
      <div class="pthumb" style="background-image:url('${esc(thumb)}')"></div>
      <div class="pbody" style="padding-bottom:8px">
        <p class="invite-from"><b>${esc(d.authorNickname||"ある旅人")}</b>さんから共同投稿の招待</p>
        <p class="ptitle" style="margin-bottom:0">${esc(d.title||"(無題)")}</p>
      </div>
    </a>
    <div class="pbody" style="padding-top:0">
      <div class="pacts">
        <button type="button" class="pbtn pbtn-ok" data-inv="accept" data-id="${esc(d.id)}">承認する</button>
        <button type="button" class="pbtn" data-inv="decline" data-id="${esc(d.id)}">辞退</button>
      </div>
    </div>
  </div>`;
    }).join("");
    $("inviteDot").hidden = !docs.length;
    if(docs.length && location.hash === "#collab") $("ptabs").scrollIntoView({ behavior: "smooth" });
  }catch(err){
    console.error("共同投稿の招待の読み込みに失敗:", err);
    wrap.hidden = true;
  }
}

$("collabInvites").addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-inv]");
  if(!btn) return;
  const id = btn.dataset.id, act = btn.dataset.inv;
  const uid = auth.currentUser && auth.currentUser.uid;
  if(!id || !uid) return;
  btn.disabled = true;
  try{
    const ref = doc(db, "articles", id);
    if(act === "accept"){
      await updateDoc(ref, { coAuthorInvites: arrayRemove(uid), coAuthorIds: arrayUnion(uid) });
    }else{
      await updateDoc(ref, { coAuthorInvites: arrayRemove(uid) });
    }
    await Promise.all([loadCollabInvites(uid), loadMyPosts(uid)]);
  }catch(err){
    console.error(err);
    btn.disabled = false;
    alert("操作に失敗しました：" + (err.message || err));
  }
});

async function loadSavedPosts(uid){
  const box = $("savedPosts");
  box.innerHTML = `<p class="posts-empty">読み込み中…</p>`;
  try{
    const savesSnap = await getDocs(collection(db, "users", uid, "saves"));
    const entries = [];
    savesSnap.forEach(s => entries.push({ id: s.id, savedAt: s.data().savedAt }));
    entries.sort((a,b) => (b.savedAt?.seconds||0) - (a.savedAt?.seconds||0));
    // 各記事を取得（公開されている／読めるものだけ表示）
    const docs = [];
    for(const e of entries){
      try{
        const a = await getDoc(doc(db, "articles", e.id));
        if(a.exists()) docs.push({ id: a.id, ...a.data() });
      }catch(err){ /* 読めない記事はスキップ */ }
    }
    if(!docs.length){
      box.innerHTML = `<p class="posts-empty">保存した投稿はありません。<br>記事ページの「保存」ボタンでここに追加されます。</p>`;
      return;
    }
    box.innerHTML = docs.map(d => renderPost(d, false)).join("");
  }catch(err){
    console.error(err);
    box.innerHTML = `<p class="posts-empty">読み込みエラー：${esc(err.message||err)}</p>`;
  }
}

/* ===== フォロー数・フォロー/フォロワー一覧 ===== */
async function loadFollowCounts(uid){
  try{
    const fr = await getCountFromServer(collection(db, "users", uid, "followers"));
    $("followerCount").textContent = fr.data().count;
  }catch(e){ console.warn("フォロワー数の取得に失敗:", e); }
  try{
    const fg = await getCountFromServer(collection(db, "users", uid, "following"));
    $("followingCount").textContent = fg.data().count;
  }catch(e){ console.warn("フォロー数の取得に失敗:", e); }
}

function closeFModal(){ $("fModal").classList.remove("open"); }
$("fClose").onclick = closeFModal;
$("fModal").addEventListener("click", e => { if(e.target.id === "fModal") closeFModal(); });

// type: "followers" | "following"
async function openFollowList(uid, type){
  $("fTitle").textContent = type === "followers" ? "フォロワー" : "フォロー";
  const list = $("fList");
  list.innerHTML = `<p class="fempty">読み込み中…</p>`;
  $("fModal").classList.add("open");
  try{
    const snap = await getDocs(collection(db, "users", uid, type));
    const ids = [];
    snap.forEach(s => ids.push(s.id));
    if(!ids.length){
      list.innerHTML = `<p class="fempty">${type === "followers" ? "まだフォロワーがいません。" : "まだ誰もフォローしていません。"}</p>`;
      return;
    }
    // 各ユーザーの公開プロフィールを取得
    const profiles = await Promise.all(ids.map(async id => {
      try{
        const p = await getDoc(doc(db, "publicProfiles", id));
        return { id, ...(p.exists() ? p.data() : {}) };
      }catch(e){ return { id }; }
    }));
    list.innerHTML = profiles.map(p => {
      const nick = p.nickname || "旅人";
      const photo = p.photoURL || "";
      const av = photo
        ? `<div class="fav" style="background-image:url('${esc(photo)}')"></div>`
        : `<div class="fav">${esc((String(nick).trim().charAt(0) || "?").toUpperCase())}</div>`;
      return `<a class="frow" href="./user.html?uid=${esc(p.id)}">${av}<span class="fnk">${esc(nick)}</span></a>`;
    }).join("");
  }catch(err){
    console.error(err);
    list.innerHTML = `<p class="fempty">読み込みに失敗しました。</p>`;
  }
}

onAuthStateChanged(auth, async (user) => {
  $("authLoading").classList.add("hide"); // 判定が出たらローディングを消す
  if(user && user.emailVerified){
    // プロフィール取得（nickname / photoURL）
    let nick = user.displayName || "";
    let photo = user.photoURL || "";
    try{
      const snap = await getDoc(doc(db, "users", user.uid));
      if(snap.exists()){
        const u = snap.data();
        if(u.nickname) nick = u.nickname;
        if(u.photoURL) photo = u.photoURL;
        $("bio").value = u.bio || "";
        $("instagram").value = u.instagram || "";
      }
    }catch(e){}
    $("authCard").classList.add("hide");
    $("meCard").classList.remove("hide");
    $("meNick").textContent = nick || "(名前未設定)";
    $("editNick").value = nick || "";
    $("meEmail").textContent = user.email;
    $("uidLine").textContent = "UID: " + user.uid;
    $("verifyBadge").innerHTML = user.emailVerified
      ? '<span class="badge ok">メール確認済み</span>'
      : '<span class="badge warn">メール未確認（受信ボックスを確認）</span>';
    setAvatar(photo, nick);
    loadMyPosts(user.uid);
    loadCollabInvites(user.uid);
    loadSavedPosts(user.uid);
    loadFollowCounts(user.uid);
    updatePushUI();
    // 既に許可済みで、かつ本人がオフにしていなければ、トークンを黙って更新（プロンプトは出ない）。
    if((typeof Notification !== "undefined") && Notification.permission === "granted"
       && localStorage.getItem(PUSH_PREF) !== "off"){
      enablePush().catch(() => {});
    }
    $("followerStat").onclick = () => openFollowList(user.uid, "followers");
    $("followingStat").onclick = () => openFollowList(user.uid, "following");
  }else{
    $("meCard").classList.add("hide");
    $("authCard").classList.remove("hide");
  }
});
