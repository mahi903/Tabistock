*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 48px}
.hero{background:linear-gradient(135deg,#1f6f5b,#2c9177);color:#fff;border-radius:18px;padding:18px 18px 16px;margin-bottom:14px}
.hero .eb{font-size:11px;letter-spacing:.14em;color:#ffe6a8;font-weight:700}
.hero h1{margin:4px 0 4px;font-size:22px}
.hero p{margin:0;font-size:13px;opacity:.92}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px;margin:0 0 12px}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:13px;font-weight:700;color:var(--mut);padding:8px 6px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--green);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer}
.chip.on{border-color:var(--green);background:#eef6f2;color:var(--green-d)}
.cities{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.city{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 8px 7px;text-align:left;cursor:pointer;font:inherit}
.city b{display:block;font-size:13.5px}
.city span{font-size:11.5px;color:var(--mut)}
.city.on{border-color:var(--green);box-shadow:0 0 0 2px #cfe3d9 inset}
.city.few span{color:#b6aa95}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h2{margin:0;font-size:20px}
.sub{font-size:12.5px;color:var(--mut);margin:2px 0 12px}
.best{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;background:#fff4ee;border-radius:12px;padding:10px 12px;margin-bottom:14px}
.best .l{font-size:12px;color:var(--or);font-weight:800}
.best .p{font-size:24px;font-weight:900;color:var(--or)}
.best .m{font-size:12.5px;color:var(--ink)}
.chart{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:170px;padding-top:18px;border-bottom:1px solid var(--line)}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.bar{width:100%;max-width:26px;border-radius:6px 6px 2px 2px;background:#9cc9b9}
.bar.min{background:var(--or)}
.bar.none{background:repeating-linear-gradient(45deg,#eee7da 0 4px,#f7f2e9 4px 8px);height:14px}
.val{font-size:9.5px;color:var(--mut);margin-bottom:3px;white-space:nowrap}
.val.min{color:var(--or);font-weight:800}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:5px}
.months div{text-align:center;font-size:10px;color:var(--mut)}
.months .y{color:var(--ink);font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.tbl td{padding:7px 4px;border-bottom:1px solid #f1eadc}
.tbl td:last-child{text-align:right;font-weight:700}
.tbl .src{font-size:11px;color:var(--mut);font-weight:500}
.rank h3,.links h3{margin:0 0 8px;font-size:15px}

 ['asia','アジア',[['SEL','ソウル','韓国'],['PUS','釜山','韓国'],['TPE','台北','台湾'],['HKG','香港','香港'],['SHA','上海','中国'],['BJS','北京','中国'],['BKK','バンコク','タイ'],['SGN','ホーチミン','ベトナム'],['HAN','ハノイ','ベトナム'],['DAD','ダナン','ベトナム'],['SIN','シンガポール','シンガポール'],['KUL','クアラルンプール','マレーシア'],['MNL','マニラ','フィリピン'],['CEB','セブ','フィリピン'],['DPS','バリ島','インドネシア'],['DEL','デリー','インド'],['KTM','カトマンズ','ネパール'],['ALA','アルマトイ','カザフスタン'],['TAS','タシケント','ウズベキスタン'],['DXB','ドバイ','UAE'],['IST','イスタンブール','トルコ']]],
 ['europe','ヨーロッパ',[['LON','ロンドン','イギリス'],['PAR','パリ','フランス'],['ROM','ローマ','イタリア'],['MIL','ミラノ','イタリア'],['BCN','バルセロナ','スペイン'],['MAD','マドリード','スペイン'],['LIS','リスボン','ポルトガル'],['AMS','アムステルダム','オランダ'],['FRA','フランクフルト','ドイツ'],['MUC','ミュンヘン','ドイツ'],['ZRH','チューリッヒ','スイス'],['VIE','ウィーン','オーストリア'],['PRG','プラハ','チェコ'],['BUD','ブダペスト','ハンガリー'],['HEL','ヘルシンキ','フィンランド'],['CPH','コペンハーゲン','デンマーク'],['STO','ストックホルム','スウェーデン'],['ATH','アテネ','ギリシャ']]],
 ['na','北米',[['HNL','ホノルル','アメリカ'],['LAX','ロサンゼルス','アメリカ'],['SFO','サンフランシスコ','アメリカ'],['SEA','シアトル','アメリカ'],['NYC','ニューヨーク','アメリカ'],['YVR','バンクーバー','カナダ'],['YTO','トロント','カナダ']]],
 ['la','中南米',[['MEX','メキシコシティ','メキシコ'],['CUN','カンクン','メキシコ'],['LIM','リマ','ペルー'],['SAO','サンパウロ','ブラジル'],['BUE','ブエノスアイレス','アルゼンチン']]],
 ['oc','オセアニア',[['SYD','シドニー','オーストラリア'],['MEL','メルボルン','オーストラリア'],['BNE','ブリスベン','オーストラリア'],['CNS','ケアンズ','オーストラリア'],['PER','パース','オーストラリア'],['AKL','オークランド','ニュージーランド']]],
 ['af','アフリカ',[['CAI','カイロ','エジプト'],['RAK','マラケシュ','モロッコ'],['JNB','ヨハネスブルグ','南アフリカ'],['CPT','ケープタウン','南アフリカ']]]
];
const MONTHS=['2026-11','2026-12','2027-01','2027-02','2027-03','2027-04','2027-05','2027-06','2027-07','2027-08','2027-09','2027-10'];
let origin='JP', region='asia', city='SEL';
const yen=n=>'¥'+n.toLocaleString('ja-JP');
const man=n=>(n/10000).toFixed(1).replace(/\.0$/,'')+'万';
function series(code){
  return MONTHS.map(m=>{
    const t=(FARES.TYO[code]||{})[m], o=(FARES.OSA[code]||{})[m];
    let pick=null;
    const mk=(x,f)=>({p:x[0],tr:x[1],rtr:x[2],dep:x[3],ret:x[4],from:f});
    if(origin==='TYO'&&t) pick=mk(t,'東京');
    else if(origin==='OSA'&&o) pick=mk(o,'大阪');
    else if(origin==='JP'){
      if(t&&(!o||t[0]<=o[0])) pick=mk(t,'東京');
      else if(o) pick=mk(o,'大阪');
    }
    return {m,...(pick||{})};
  });
}
const trTxt=n=>n===0?'直行':`乗継${n}回`;
const md=d=>{const [y,m,dd]=d.split('-');return Number(m)+'/'+Number(dd);};
const nights=(a,b)=>Math.round((new Date(b)-new Date(a))/86400000);
const legs=x=>x.tr===x.rtr?trTxt(x.tr):`行き${trTxt(x.tr)}・帰り${trTxt(x.rtr)}`;
function render(){
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.o===origin));
  const R=REG.find(r=>r[0]===region);
  document.getElementById('regions').innerHTML=REG.map(r=>`<button class="chip ${r[0]===region?'on':''}" data-r="${r[0]}">${r[1]}</button>`).join('');
  document.getElementById('cities').innerHTML=R[2].map(([c,n])=>{
    const s=series(c).filter(x=>x.p); const mn=s.length?Math.min(...s.map(x=>x.p)):null;
    return `<button class="city ${c===city?'on':''} ${s.length<4?'few':''}" data-c="${c}"><b>${n}</b><span>${mn?man(mn)+'〜':'集計中'}</span></button>`;
  }).join('');
  const meta=R[2].find(x=>x[0]===city)||R[2][0]; city=meta[0];
  const s=series(city), have=s.filter(x=>x.p), mn=have.length?Math.min(...have.map(x=>x.p)):null, mx=have.length?Math.max(...have.map(x=>x.p)):1;
  const best=have.find(x=>x.p===mn);
  const lbl=m=>{const [y,mm]=m.split('-');return Number(mm)+'月';};
  const oName={JP:'日本（東京・大阪の安い方）',TYO:'東京',OSA:'大阪'}[origin];
  document.getElementById('detail').innerHTML=`
    <h2>${meta[1]} <span style="font-size:13px;color:var(--mut);font-weight:500">${meta[2]}</span></h2>
    <div class="sub">${oName}発・往復の最安値（その月に出発・3〜21日間）</div>
    ${best?`<div class="best"><span class="l">いちばん安い月</span><span class="p">${yen(best.p)}</span><span class="m">${md(best.dep)}〜${md(best.ret)}（${nights(best.dep,best.ret)}泊）・${best.from}発・${legs(best)}</span></div>`:'<div class="best"><span class="m">まだデータがありません</span></div>'}
    <div class="chart">${s.map(x=>x.p?`<div class="col"><div class="val ${x.p===mn?'min':''}">${man(x.p)}</div><div class="bar ${x.p===mn?'min':''}" style="height:${Math.max(12,Math.round(x.p/mx*130))}px"></div></div>`:`<div class="col"><div class="val">-</div><div class="bar none"></div></div>`).join('')}</div>
    <div class="months">${s.map(x=>`<div class="${x.m.endsWith('-01')||x.m==='2026-11'?'y':''}">${lbl(x.m)}${x.m.endsWith('-01')?'<br>27年':x.m==='2026-11'?'<br>26年':''}</div>`).join('')}</div>
    <div class="legend"><span><i style="background:var(--or)"></i>最安の月</span><span><i style="background:#9cc9b9"></i>その月の最安値</span><span><i style="background:#eee7da"></i>集計中</span></div>
    <table class="tbl">${have.sort((a,b)=>a.p-b.p).slice(0,3).map((x,i)=>`<tr><td>${i+1}. ${lbl(x.m)}（${x.m.slice(0,4)}年） <span class="src">${md(x.dep)}〜${md(x.ret)}・${x.from}発・${legs(x)}</span></td><td>${yen(x.p)}</td></tr>`).join('')}</table>
    <div class="links"><a href="search.html?q=${encodeURIComponent(meta[2])}">${meta[2]}の旅行記をTabistockで見る →</a></div>`;
  const c=CMP[city];
  const cmpEl=document.getElementById('cmp');
  if(c&&c.length&&origin!=='OSA'){
    cmpEl.hidden=false;
    cmpEl.innerHTML=`<h3>片道2枚 vs 往復（東京発）</h3><p class="s">同じ月に出発する場合。片道は「行き＋帰り」を別々に買ったときの合計。</p><table><tr><th>出発月</th><th>片道2枚</th><th>往復</th><th>差</th></tr>${c.map(([m,g,b,r])=>{const d=g+b-r;return `<tr><td>${lbl(m)}</td><td class="${d<0?'w':''}">${yen(g+b)}</td><td class="${d>0?'w':''}">${yen(r)}</td><td class="d">${d<0?'片道が'+yen(-d)+'安い':d>0?'往復が'+yen(d)+'安い':'同じ'}</td></tr>`}).join('')}</table>`;
  }else{ cmpEl.hidden=true; cmpEl.innerHTML=''; }
  const rk=R[2].map(([c,n,k])=>{const h=series(c).filter(x=>x.p);return h.length?{n,k,p:Math.min(...h.map(x=>x.p))}:null}).filter(Boolean).sort((a,b)=>a.p-b.p).slice(0,5);
  document.getElementById('rank').innerHTML=`<h3>${R[1]}で安く行ける都市 TOP5</h3><ol>${rk.map(x=>`<li><b>${x.n}</b>${x.k}<span>${yen(x.p)}〜</span></li>`).join('')}</ol>`;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.o){origin=b.dataset.o;}
  if(b.dataset.r){region=b.dataset.r;city=REG.find(r=>r[0]===region)[2][0][0];}
  if(b.dataset.c){city=b.dataset.c;}
  render();
});
render();
</script></body></html>
