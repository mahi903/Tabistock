<style>
:root{ --green:#1f6f5b; --green-d:#185645; --or:#e2683b; --line:#e9dcc6; --ink:#1b2330; --mut:#6c7787; --bg:#fbf9f4; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 48px}
.hero{background:linear-gradient(135deg,#1f6f5b,#2c9177);color:#fff;border-radius:18px;padding:18px 18px 16px;margin-bottom:14px}
.hero .eb{font-size:11px;letter-spacing:.14em;color:#ffe6a8;font-weight:700}
.hero h1{margin:4px 0 4px;font-size:22px}
.hero p{margin:0;font-size:13px;opacity:.92}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px;margin:0 0 12px}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:13px;font-weight:700;color:var(--mut);padding:8px 6px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--green);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer}
.chip.on{border-color:var(--green);background:#eef6f2;color:var(--green-d)}
.mapbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px;margin-bottom:12px;position:relative}
.mapbox svg{display:block;width:100%;height:auto;touch-action:manipulation}
.mapbox .dot{fill:#d9d2c3}
.mapbox .jp{fill:var(--green)}
.mapbox .pin{cursor:pointer}
.mapbox .pin circle.hit{fill:transparent}
.mapbox .pin circle.c{fill:var(--green);stroke:#fff}
.mapbox .pin.cheap circle.c{fill:var(--or)}
.mapbox .pin.on circle.c{fill:#1b2330}
.mapbox .pin text{font-family:inherit;font-weight:800;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-linejoin:round}
.mapbox .pin text.p{fill:var(--green-d);font-weight:700}
.mapbox .pin.cheap text.p{fill:var(--or)}
.picker{display:flex;gap:6px;overflow-x:auto;margin:-4px 0 14px;padding-bottom:4px;scrollbar-width:none}
.picker::-webkit-scrollbar{display:none}
.picker button{flex:none;border:0;background:none;font:inherit;font-size:12.5px;color:var(--mut);padding:4px 8px;border-radius:999px;cursor:pointer;white-space:nowrap}
.picker button b{color:var(--ink);font-weight:700;margin-right:4px}
.picker button.on{background:#1b2330;color:#fff}.picker button.on b{color:#fff}
.cities{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.city{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 8px 7px;text-align:left;cursor:pointer;font:inherit}
.city b{display:block;font-size:13.5px}
.city span{font-size:11.5px;color:var(--mut)}
.city.on{border-color:var(--green);box-shadow:0 0 0 2px #cfe3d9 inset}
.city.few span{color:#b6aa95}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h2{margin:0;font-size:20px}
.sub{font-size:12.5px;color:var(--mut);margin:2px 0 12px}
.best{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;background:#fff4ee;border-radius:12px;padding:10px 12px;margin-bottom:14px}
.best .l{font-size:12px;color:var(--or);font-weight:800}
.best .p{font-size:24px;font-weight:900;color:var(--or)}
.best .m{font-size:12.5px;color:var(--ink)}
.chart{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:170px;padding-top:18px;border-bottom:1px solid var(--line)}
.col{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.bar{width:100%;max-width:26px;border-radius:6px 6px 2px 2px;background:#9cc9b9}
.bar.min{background:var(--or)}
.bar.none{background:repeating-linear-gradient(45deg,#eee7da 0 4px,#f7f2e9 4px 8px);height:14px}
.val{font-size:9px;letter-spacing:-.02em;color:var(--mut);margin-bottom:3px;white-space:nowrap}
.val.min{color:var(--or);font-weight:800}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:5px}
.months div{text-align:center;font-size:10px;color:var(--mut)}
.months .y{color:var(--ink);font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.tbl td{padding:7px 4px;border-bottom:1px solid #f1eadc}
.tbl td:last-child{text-align:right;font-weight:700}
.tbl .src{font-size:11px;color:var(--mut);font-weight:500}
.rank h3,.links h3{margin:0 0 8px;font-size:15px}
.rank ol{margin:0;padding-left:20px}
.rank li{padding:5px 0;font-size:13.5px}
.rank li b{margin-right:6px}
.rank li span{float:right;font-weight:800;color:var(--green-d)}
.links a{display:block;padding:11px 12px;border:1px solid var(--line);border-radius:12px;color:var(--green-d);font-weight:700;text-decoration:none;font-size:13.5px;margin-top:8px}
.cmp h3{margin:0 0 4px;font-size:15px}.cmp .s{font-size:12px;color:var(--mut);margin:0 0 8px}.cmp table{width:100%;border-collapse:collapse;font-size:12.5px}.cmp th{font-size:11px;color:var(--mut);font-weight:600;text-align:right;padding:4px}.cmp th:first-child{text-align:left}.cmp td{padding:7px 4px;border-top:1px solid #f1eadc;text-align:right;white-space:nowrap}.cmp td:first-child{text-align:left}.cmp .w{color:var(--or);font-weight:800}.cmp .d{font-size:11px}
.real h3{margin:0 0 4px;font-size:15px}.real .s{font-size:12px;color:var(--mut);margin:0 0 6px}.real a{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #f1eadc;text-decoration:none;color:var(--ink)}.real a:first-of-type{border-top:0}.real .t{font-size:13px;font-weight:700;line-height:1.4}.real .m2{font-size:11.5px;color:var(--mut);margin-top:2px}.real .y{font-weight:900;color:var(--green-d);white-space:nowrap;font-size:15px}.real .y small{display:block;font-size:10.5px;font-weight:600;color:var(--mut);text-align:right}.real .links a{display:block;padding:11px 12px;border:1px solid var(--line);border-radius:12px;margin-top:10px;color:var(--green-d);font-weight:700;font-size:13.5px}.real .empty{font-size:12.5px;color:var(--mut)}
.note{font-size:11.5px;color:var(--mut);margin-top:6px}
</style></head>

  pins.innerHTML=`<circle class="jp" cx="139.7" cy="-35.7" r="${k*1.1}"/>`+
  items.map(({c,n,mn})=>{const [x,y]=LL[c]; const on=c===city; const cheap=mn&&mn<=cheapLine;
    return `<g class="pin ${on?'on':''} ${cheap?'cheap':''}" data-c="${c}"><circle class="hit" cx="${x}" cy="${-y}" r="${k*3.2}"/><circle class="c" cx="${x}" cy="${-y}" r="${k*(on?1.5:1.05)}" stroke-width="${k*.35}"/>`+
      (on?`<text x="${x+k*2}" y="${-y-k*.6}" font-size="${fs*1.15}" stroke-width="${k*.7}">${n}</text><text class="p" x="${x+k*2}" y="${-y+fs*.95}" font-size="${fs}" stroke-width="${k*.6}">${mn?man(mn)+'〜':'集計中'}</text>`
          :`<text class="p" x="${x+k*1.6}" y="${-y+fs*.35}" font-size="${fs*.85}" stroke-width="${k*.55}">${mn?man(mn):''}</text>`)+`</g>`;}).join('');
  svg.appendChild(pins);
  // 下の都市名リスト（安い順）
  document.getElementById('cities').innerHTML=items.slice().sort((a,b)=>(a.mn||1e9)-(b.mn||1e9)).map(({c,n,mn})=>`<button class="${c===city?'on':''}" data-c="${c}"><b>${n}</b>${mn?man(mn):'-'}</button>`).join('');
}
function render(){
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.o===origin));
  const R=REG.find(r=>r[0]===region);
  document.getElementById('regions').innerHTML=REG.map(r=>`<button class="chip ${r[0]===region?'on':''}" data-r="${r[0]}">${r[1]}</button>`).join('');
  const meta=R[2].find(x=>x[0]===city)||R[2][0]; city=meta[0];
  drawMap(R);
  const s=series(city), have=s.filter(x=>x.p), mn=have.length?Math.min(...have.map(x=>x.p)):null, mx=have.length?Math.max(...have.map(x=>x.p)):1;
  const best=have.find(x=>x.p===mn);
  const lbl=m=>{const [y,mm]=m.split('-');return Number(mm)+'月';};
  const oName={JP:'日本（東京・大阪の安い方）',TYO:'東京',OSA:'大阪'}[origin];
  document.getElementById('detail').innerHTML=`
    <h2>${meta[1]} <span style="font-size:13px;color:var(--mut);font-weight:500">${meta[2]}</span></h2>
    <div class="sub">${oName}発・往復の最安値（その月に出発）</div>
    ${best?`<div class="best"><span class="l">いちばん安い月</span><span class="p">${yen(best.p)}</span><span class="m">${lbl(best.m)}・${when(best)}${best.from}発・${legs(best)}</span></div>`:'<div class="best"><span class="m">まだデータがありません</span></div>'}
    <div class="chart">${s.map(x=>x.p?`<div class="col"><div class="val ${x.p===mn?'min':''}">${man(x.p)}</div><div class="bar ${x.p===mn?'min':''}" style="height:${Math.max(12,Math.round(x.p/mx*130))}px"></div></div>`:`<div class="col"><div class="val">-</div><div class="bar none"></div></div>`).join('')}</div>
    <div class="months">${s.map(x=>`<div class="${x.m.endsWith('-01')||x.m==='2026-11'?'y':''}">${lbl(x.m)}${x.m.endsWith('-01')?'<br>27年':x.m==='2026-11'?'<br>26年':''}</div>`).join('')}</div>
    <div class="legend"><span><i style="background:var(--or)"></i>最安の月</span><span><i style="background:#9cc9b9"></i>その月の最安値</span><span><i style="background:#eee7da"></i>集計中</span></div>
    <table class="tbl">${have.sort((a,b)=>a.p-b.p).slice(0,3).map((x,i)=>`<tr><td>${i+1}. ${lbl(x.m)}（${x.m.slice(0,4)}年） <span class="src">${when2(x)}${x.from}発・${legs(x)}</span></td><td>${yen(x.p)}</td></tr>`).join('')}</table>`;
  renderReal(meta);
  const c=null;
  const cmpEl=document.getElementById('cmp');
  if(c&&c.length&&origin!=='OSA'){
    cmpEl.hidden=false;
    cmpEl.innerHTML=`<h3>片道2枚 vs 往復（東京発）</h3><p class="s">同じ月に出発する場合。片道は「行き＋帰り」を別々に買ったときの合計。</p><table><tr><th>出発月</th><th>片道2枚</th><th>往復</th><th>差</th></tr>${c.map(([m,g,b,r])=>{const d=g+b-r;return `<tr><td>${lbl(m)}</td><td class="${d<0?'w':''}">${yen(g+b)}</td><td class="${d>0?'w':''}">${yen(r)}</td><td class="d">${d<0?'片道が'+yen(-d)+'安い':d>0?'往復が'+yen(d)+'安い':'同じ'}</td></tr>`}).join('')}</table>`;
  }else{ cmpEl.hidden=true; cmpEl.innerHTML=''; }
  const rk=R[2].map(([c,n,k])=>{const h=series(c).filter(x=>x.p);return h.length?{n,k,p:Math.min(...h.map(x=>x.p))}:null}).filter(Boolean).sort((a,b)=>a.p-b.p).slice(0,5);
  document.getElementById('rank').innerHTML=`<h3>${R[1]}で安く行ける都市 TOP5</h3><ol>${rk.map(x=>`<li><b>${x.n}</b>${x.k}<span>${yen(x.p)}〜</span></li>`).join('')}</ol>`;
}

function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function renderReal(meta){
  const el=document.getElementById('real'); if(!el) return;
  if(ARTS===null){ el.innerHTML='<h3>Tabistockの実例</h3><p class="empty">記事を読み込み中…</p>'; return; }
  const key=CK[meta[0]], cityJp=meta[1];
  const rows=[];
  ARTS.forEach(a=>{
    if(a.notFromJapan || !(a.countries||[]).includes(key)) return;
    const fl=(a.flights||[]).filter(f=>f && Number(f.price)>0 && (!f.mode||f.mode==='plane'));
    if(!fl.length) return;
    const total=fl.reduce((t,f)=>t+Number(f.price),0);
    const routes=fl.map(f=>f.route||[f.from,f.to].filter(Boolean).join(' → '));
    const hit=routes.join(' ').includes(cityJp)?1:0;
    rows.push({a,fl,total,routes,hit,round:fl.length===1&&fl[0].trip==='round'});
  });
  rows.sort((x,y)=>y.hit-x.hit||x.total-y.total);
  const top=rows.slice(0,4);
  el.innerHTML=`<h3>Tabistockでは、実際にいくらで行った？</h3><p class="s">${esc(meta[2])}の旅行記で、日本から行った人の航空券（旅全体の合計）</p>`+
    (top.length?top.map(({a,fl,total,routes,round})=>`<a href="articles/view.html?id=${encodeURIComponent(a.id)}"><div><div class="t">${esc(a.title||'')}</div><div class="m2">${esc(routes.length>2?routes[0]+' ほか'+(routes.length-1)+'区間':routes.join(' ／ '))}${a.flightWhen?'・予約：'+esc(a.flightWhen):''}${a.flightSite?'（'+esc(a.flightSite)+'）':''}</div></div><div class="y">${yen(total)}<small>${round?'往復':'航空券の合計'}</small></div></a>`).join('')
      +`<div class="links"><a href="search.html?q=${encodeURIComponent(meta[2])}">${esc(meta[2])}の旅行記をTabistockで見る →</a></div>`
      :'<p class="empty">まだこの国の航空券の記録はありません。行ったことがあれば、ぜひ投稿してください。</p>');
}
document.addEventListener('click',e=>{
  const pin=e.target.closest&&e.target.closest('.pin'); if(pin){ city=pin.dataset.c; render(); return; }
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.o){origin=b.dataset.o;}
  if(b.dataset.r){region=b.dataset.r;city=REG.find(r=>r[0]===region)[2][0][0];}
  if(b.dataset.c){city=b.dataset.c;}
  render();
});
render();
</script>
<script type="module">
import { db } from "./firebase-config.js";
import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
try{
  const snap=await getDocs(query(collection(db,"articles"),where("status","==","published")));
  window.ARTS_LOADED=[]; snap.forEach(d=>window.ARTS_LOADED.push({id:d.id,...d.data()}));
}catch(e){ console.warn('記事の読み込みに失敗',e); window.ARTS_LOADED=[]; }
window.dispatchEvent(new Event('arts-loaded'));
</script></body></html>
