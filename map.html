<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="description" content="世界地図から、行きたい国の旅程を探せます。ピンをタップすると、その国に投稿された旅のしおりが一覧で見られます。">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

  <!-- Leaflet（無料・OpenStreetMap） -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html,body{height:100%}
    body{margin:0;display:flex;flex-direction:column;overflow:hidden}
    .hd{position:static;background:rgba(246,239,228,.92);backdrop-filter:blur(12px);box-shadow:0 2px 14px rgba(0,0,0,.06);flex:0 0 auto}
    .hd .logo{color:#1f6f5b}
    .burger span{background:#1b2330}
    .mapwrap{flex:1 1 auto;position:relative;min-height:0}
    #map{position:absolute;inset:0;background:#e6ecea;z-index:0}
    .leaflet-container{background:#e6ecea;font-family:inherit}
    .leaflet-control-attribution{background:rgba(255,255,255,.6)!important;font-size:9px}
    .leaflet-interactive{outline:none}
    /* 国ラベル */
    .cl-wrap{background:none;border:none;width:0!important;height:0!important;margin:0!important}
    .region-bar .region-chip{padding:6px 9px;font-size:12px;gap:5px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
    .region-bar .region-chip .rc-num{min-width:17px;height:17px;font-size:10px;padding:0 4px}
    .region-chip.empty{color:#9aa3ad}.region-chip.empty .rc-num{background:#f1ece3;color:#9aa3ad}
    .cldot{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:#1b2330;border:1.5px solid #fff}
    .clline{position:absolute;left:0;top:0;height:1.5px;background:rgba(27,35,48,.45);transform-origin:0 50%;pointer-events:none}
    .clabel{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:4px;background:#fff;border-radius:5px;padding:3px 5px 3px 7px;font-size:10.5px;font-weight:800;color:#1b2330;box-shadow:0 2px 8px rgba(27,35,48,.18);white-space:nowrap;cursor:pointer;font-family:"Noto Sans JP",sans-serif;line-height:1.2}
    .clabel b{display:inline-flex;align-items:center;justify-content:center;min-width:15px;height:15px;padding:0 3px;border-radius:3px;background:#1f6f5b;color:#fff;font-size:9.5px}
    .clabel:hover{background:#1f6f5b;color:#fff}.clabel:hover b{background:#fff;color:#1f6f5b}
    /* 大陸チップ（引きで選ぶ） */
    .region-bar{position:absolute;top:10px;left:0;right:0;z-index:15;display:flex;flex-wrap:wrap;gap:6px;padding:0 10px}
    .region-bar::-webkit-scrollbar{display:none}
    .region-chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid #e9dcc6;border-radius:999px;padding:9px 15px;font-size:13px;font-weight:800;color:#1f6f5b;box-shadow:0 4px 14px rgba(0,0,0,.12);cursor:pointer;font-family:inherit;white-space:nowrap}
    .region-chip.active{background:#1f6f5b;color:#fff;border-color:#1f6f5b}
    .region-chip .rc-num{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#eaf3ef;color:#1f6f5b;font-size:11px;font-weight:800}
    .region-chip.active .rc-num{background:rgba(255,255,255,.25);color:#fff}
    .region-chip.back{color:#6c7787}
    /* 大陸ボタン（地図上・各地域の中心に配置） */
    .leaflet-div-icon.area-wrap{background:none;border:none;width:0!important;height:0!important;margin:0!important}
    .area-btn{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:7px;background:#fff;border:2px solid #1f6f5b;border-radius:999px;padding:9px 15px;font-size:14px;font-weight:800;color:#1f6f5b;box-shadow:0 5px 16px rgba(0,0,0,.22);white-space:nowrap;cursor:pointer;font-family:"Noto Sans JP",sans-serif}
    .area-btn:hover{background:#1f6f5b;color:#fff}
    @media(max-width:640px){.area-wrap{display:none!important}}
    
    .area-btn .ab-num{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#eaf3ef;color:#1f6f5b;font-size:11px;font-weight:800}
    .area-btn:hover .ab-num{background:rgba(255,255,255,.25);color:#fff}
    /* マップ上のヒント */
    .map-hint{position:absolute;top:var(--hint-top,62px);left:50%;transform:translateX(-50%);z-index:5;background:#fff;border:1px solid #e9dcc6;border-radius:999px;padding:8px 16px;font-size:12.5px;font-weight:700;color:#1f6f5b;box-shadow:0 4px 14px rgba(0,0,0,.1);white-space:nowrap}
    .map-loading{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(247,241,232,.7);font-size:14px;color:#6c7787;font-weight:700}
    /* 国ピン（数字つき） */
    .ctpin{background:#1f6f5b;color:#fff;border:2.5px solid #fff;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;box-shadow:0 3px 10px rgba(0,0,0,.3);font-family:"Noto Sans JP",sans-serif}
    .ctpin:hover{background:#185645}
    /* 下からのパネル */
    .panel{position:absolute;left:0;right:0;bottom:0;z-index:40;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -6px 28px rgba(0,0,0,.18);transform:translateY(110%);transition:transform .26s ease;max-height:62%;display:flex;flex-direction:column}
    .panel.open{transform:none}
    @media(min-width:640px){.panel{left:auto;right:18px;bottom:18px;width:380px;border-radius:18px;max-height:calc(100% - 36px)}}
    .panel .phead{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid #eee3d2}
    .panel .phead h3{margin:0;font-size:16px;font-weight:800;color:#1b2330}
    .panel .phead .psub{font-size:11.5px;color:#6c7787;font-weight:600;margin-top:2px}
    .panel .pclose{background:none;border:none;font-size:23px;line-height:1;color:#6c7787;cursor:pointer;padding:0 4px}
    .panel .plist{overflow:auto;padding:8px 0}
    .prow{display:flex;gap:12px;padding:10px 18px;text-decoration:none;color:inherit;align-items:center}
    .prow:hover{background:#faf6ee}
    .prow .pth{width:74px;height:54px;border-radius:10px;background-size:cover;background-position:center;background-color:#e9dcc6;flex-shrink:0}
    .prow .pt{font-size:13.5px;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .prow .pm{font-size:11px;color:#6c7787;margin-top:3px}
    .pempty{color:#6c7787;font-size:13px;text-align:center;padding:30px 16px}
    /* ドロワー内ナビ */
    .drawer{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
    .drawer .dnav{display:flex;flex-direction:column;margin-bottom:16px}
    .drawer .dnav a{padding:15px 4px;font-size:16px;font-weight:700;color:#1b2330;text-decoration:none;border-bottom:1px solid #e9dcc6}
    .drawer .dnav a.cur{color:#1f6f5b}
  /* ボタンは角が少し丸い四角で統一（横長の丸ボタンはやめる） */
.region-chip,.area-btn{border-radius:8px}
</style>
</head>
<body>
  <header class="hd" id="hd">
    <a class="logo" href="index.html">Tabistock</a>
    <div class="hd-r">
      <form class="hd-search" action="search.html" method="get"><input name="q" placeholder="旅先・キーワードで検索"><button type="submit">⌕</button></form>
      <button class="burger" id="burger" aria-label="メニューを開く"><span></span><span></span><span></span></button>
    </div>
  </header>
  <div class="ovl" id="ovl"></div>
  <nav class="drawer" id="drawer">
    <button class="dclose" id="dclose" aria-label="閉じる">×</button>
    <p class="dtitle">メニュー</p>
    <div class="dnav">
      <a href="index.html">トップ</a>
      <a href="search.html">条件で旅を検索</a>
      <a href="map.html" class="cur">地図で旅を探す</a>
    </div>
    <div id="authStatus" class="auth-status"></div>
  </nav>

  <div class="mapwrap">
    <div id="map"></div>
    <div class="region-bar" id="regionBar"></div>
    <div class="map-hint" id="mapHint" hidden></div>
    <div class="map-loading" id="mapLoading">地図を読み込み中…</div>

    <!-- 国別の旅程パネル -->
    <div class="panel" id="panel">
      <div class="phead">
        <div>
          <h3 id="panelTitle">—</h3>
          <div class="psub" id="panelSub"></div>
        </div>
        <button class="pclose" id="panelClose" type="button" aria-label="閉じる">×</button>
      </div>
      <div class="plist" id="panelList"></div>
    </div>
  </div>

  <!-- ドロワー開閉 -->
  <script>
  (function(){
    var burger=document.getElementById('burger'),nav=document.getElementById('drawer'),ovl=document.getElementById('ovl'),dc=document.getElementById('dclose');
    if(burger&&nav&&ovl){
      var t=function(o){burger.classList.toggle('open',o);nav.classList.toggle('open',o);ovl.classList.toggle('open',o);};
      burger.addEventListener('click',function(){t(!nav.classList.contains('open'))});
      ovl.addEventListener('click',function(){t(false)});
      if(dc)dc.addEventListener('click',function(){t(false)});
      nav.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){t(false)})});
    }
  })();
  </script>

  <!-- Leaflet 本体 -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- 地図ロジック -->
  <script type="module">
    import { db } from "./firebase-config.js";
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { COUNTRIES, COUNTRY_LL, COUNTRY_ISO, cinfo, REGION_JP, BUDGETS, DAYS_OPT, esc, budgetOf } from "./tabistock-render.js";

    if(typeof L === 'undefined'){
      document.getElementById('mapLoading').textContent = '地図ライブラリ(Leaflet)を読み込めませんでした。通信環境をご確認ください。';
      throw new Error('Leaflet not loaded');
    }

    // 大陸（細かい地域をまとめる）
    const CONTINENTS = [
      // view：エリアを開いたときに見せる範囲（[[南,西],[北,東]]）。主要な国がきちんと収まるように手で決めている
      { k:'east-asia',      jp:'東アジア',   regions:['east-asia'],      at:[40,116], view:[[15,72],[55,148]] },
      { k:'southeast-asia', jp:'東南アジア', regions:['southeast-asia'], at:[9,110],  view:[[-12,90],[26,142]] },
      { k:'south-asia',     jp:'南アジア',   regions:['south-asia'],     at:[19,78],  view:[[2,58],[38,100]] },
      { k:'central-asia',   jp:'中央アジア', regions:['central-asia'],   at:[45,66],  view:[[34,44],[56,90]] },
      { k:'west-asia',      jp:'西アジア',   regions:['west-asia'],      at:[27,46],  view:[[11,24],[44,64]] },
      { k:'europe',         jp:'ヨーロッパ', regions:['europe'],                      view:[[34,-25],[71,45]] },
      { k:'north-america',  jp:'北アメリカ', regions:['north-america'],               view:[[5,-170],[72,-50]] },
      { k:'south-america',  jp:'南アメリカ', regions:['south-america'],               view:[[-56,-84],[14,-32]] },
      { k:'africa',         jp:'アフリカ',   regions:['africa'],                      view:[[-36,-20],[38,55]] },
      { k:'oceania',        jp:'オセアニア', regions:['oceania'],                     view:[[-48,110],[2,182]] },
    ];
    const regionToCont = {};
    CONTINENTS.forEach(ct => ct.regions.forEach(r => { regionToCont[r] = ct.k; }));
    // 「その他」地域の国・島は、地図上では近い大陸のボタンにまとめる
    const MAP_CONT_OF = { greenland:'north-america', 'puerto-rico':'north-america', antarctica:'south-america', hawaii:'oceania', guam:'oceania', saipan:'oceania' };
    const contOfCountry = c => { if(MAP_CONT_OF[c]) return MAP_CONT_OF[c]; const info = cinfo(c); return info ? regionToCont[info.r] : null; };
    // 日付変更線をまたぐ地域（オセアニア：サモア・トンガ・タヒチ・ハワイなど）は、
    // 西経を +360° して東側へ連続させる。そうしないと範囲が地球を一周して中心がアフリカ沖になる。
    const WRAP_CONT = new Set(['oceania']);
    const llOf = c => {
      const ll = COUNTRY_LL[c]; if(!ll) return null;
      return (WRAP_CONT.has(contOfCountry(c)) && ll[1] < 0) ? [ll[0], ll[1] + 360] : ll;
    };
    // 大陸ごとの範囲（投稿の有無に関係なく、その大陸の全対象国の座標から算出）
    const contBounds = {};
    CONTINENTS.forEach(ct => {
      const lls = COUNTRIES.filter(co => contOfCountry(co.v) === ct.k && co.v !== 'antarctica').map(co => llOf(co.v)).filter(Boolean);
      if(lls.length) contBounds[ct.k] = L.latLngBounds(lls);
    });

    const map = L.map('map', { worldCopyJump:true, minZoom:1, zoomSnap:0.25, zoomControl: window.innerWidth > 640 }).setView([28, 30], 2);
    // 最初の画面：ヨーロッパ〜日本まで（ボタンのある範囲）が入るように合わせる
    const OVERVIEW = L.latLngBounds([[-40,-110],[66,150]]);
    map.setMaxZoom(7);
    map.attributionControl.setPrefix('').addAttribution('Natural Earth');
    // 白地図（世界の陸地）：タイル画像を使わず、ベクターで描く
    const shapesP = fetch('/country-shapes.json').then(r=>r.json()).catch(()=>({}));
    fetch('/world-base.json').then(r=>r.json()).then(g=>{
      L.geoJSON(g,{ interactive:false, style:{ color:'#ffffff', weight:0.8, fillColor:'#f7f2e9', fillOpacity:1 } }).addTo(map).bringToBack();
    });
    // flexレイアウト内でのサイズ確定ずれ対策
    setTimeout(()=>map.invalidateSize(), 200);
    window.addEventListener('resize', ()=>{ map.invalidateSize(); if(typeof placeHint==='function') placeHint(); });

    const panel = document.getElementById('panel');
    const panelTitle = document.getElementById('panelTitle');
    const panelSub = document.getElementById('panelSub');
    const panelList = document.getElementById('panelList');
    const hint = document.getElementById('mapHint');
    const regionBar = document.getElementById('regionBar');
    document.getElementById('panelClose').addEventListener('click', ()=> panel.classList.remove('open'));

    const budgetL = v => (BUDGETS.find(b=>b.v===v)||{}).l || '';
    const daysL   = v => (DAYS_OPT.find(d=>d.v===v)||{}).l || '';

    function renderRow(d){
      const thumb = d.thumbUrl || (d.heroUrls && d.heroUrls[0]) || "";
      const cs = (d.countries||[]).map(c=>(cinfo(c)||{}).jp).filter(Boolean).join('・');
      const meta = [cs, budgetL(budgetOf(d)), daysL(d.days_v)].filter(Boolean).join(' · ');
      return `<a class="prow" href="./articles/view.html?id=${esc(d.id)}">
        <div class="pth" style="background-image:url('${esc(thumb)}')"></div>
        <div><div class="pt">${esc(d.title||'(無題)')}</div><div class="pm">${esc(meta)}</div></div>
      </a>`;
    }

    function openCountry(countryV, articles){
      const info = cinfo(countryV) || {jp:countryV, r:''};
      panelTitle.textContent = info.jp;
      panelSub.textContent = (REGION_JP[info.r]||'') + `　${articles.length}件の旅程`;
      panelList.innerHTML = articles.length
        ? articles.map(renderRow).join('')
        : `<p class="pempty">この国の旅程はまだありません。</p>`;
      panel.classList.add('open');
    }

    // 大陸ごとのマーカー群と、その大陸の（重複なし）投稿数
    const contGroups = {};
    const contCount = {};
    const contLabelGroup = L.layerGroup();   // 各地域の中心に置く大陸ボタン
    let activeCont = null;

    // 上のチップの高さぶん、地図の表示範囲を下にずらす
    const topPad = () => { const b = regionBar.getBoundingClientRect(), m = document.getElementById('map').getBoundingClientRect(); return Math.max(0, b.bottom - m.top) + 12; };
    const fitView = (bounds) => map.fitBounds(bounds, { paddingTopLeft:[12, topPad()], paddingBottomRight:[12, 16] });
    const placeHint = () => { const b = regionBar.getBoundingClientRect(), m = document.getElementById('map').getBoundingClientRect(); hint.style.setProperty('--hint-top', (b.bottom - m.top + 8) + 'px'); };

    const showOverview = () => {
      activeCont = null;
      CONTINENTS.forEach(ct => { if(contGroups[ct.k]) map.removeLayer(contGroups[ct.k]); });
      if(window.__contFill) window.__contFill.addTo(map);
      contLabelGroup.addTo(map);             // 大陸ボタンを表示
      panel.classList.remove('open');
      hint.textContent = '上のエリアか、緑の国をタップ';
      renderChips(); placeHint();
      fitView(OVERVIEW);
    };

    const showContinent = (k) => {
      activeCont = k;
      map.removeLayer(contLabelGroup);       // 大陸ボタンを隠す
      if(window.__contFill) map.removeLayer(window.__contFill);
      CONTINENTS.forEach(ct => { if(contGroups[ct.k]) map.removeLayer(contGroups[ct.k]); });
      if(contGroups[k]) contGroups[k].addTo(map);
      panel.classList.remove('open');
      const ctd = CONTINENTS.find(c=>c.k===k) || {};
      hint.textContent = (ctd.jp||'') + 'の国をタップで旅程一覧';
      renderChips(); placeHint();
      const vb = ctd.view ? L.latLngBounds(ctd.view) : contBounds[k];
      if(vb) fitView(vb);
      setTimeout(layoutLabels, 350);
    };

    // 国ラベルの重なりを避ける：投稿数の多い国から順に、国の点のまわりで空いている場所を探して置く。
    // 近くに置ける場所がないラベルは隠し（点は残す）、拡大して余裕ができたら表示される
    const layoutLabels = () => {
      const items=[...document.querySelectorAll('.clabel')].filter(e=>e.offsetParent);
      if(!items.length) return;
      const P=items.map(e=>{ e.style.transform='translate(-50%,-50%)'; e.style.visibility='visible'; const r=e.getBoundingClientRect();
        return { e, x0:r.left+r.width/2, y0:r.top+r.height/2, w:r.width+4, h:r.height+4, n:+e.dataset.n }; })
        .sort((a,b)=>b.n-a.n);
      const placed=[];
      const hit=(x,y,w,h)=>placed.some(q=>Math.abs(q.x-x)<(q.w+w)/2 && Math.abs(q.y-y)<(q.h+h)/2);
      P.forEach(p=>{
        const H=p.h, W=p.w;
        const cand=[[0,0],[0,-H],[0,H],[W*0.6,0],[-W*0.6,0],[W*0.5,-H],[-W*0.5,-H],[W*0.5,H],[-W*0.5,H],[0,-2*H],[0,2*H]];
        let spot=null;
        for(const [dx,dy] of cand){ if(!hit(p.x0+dx,p.y0+dy,W,H)){ spot=[dx,dy]; break; } }
        const wrap=p.e.parentElement; let ln=wrap.querySelector('.clline');
        if(!spot){ p.e.style.visibility='hidden'; if(ln) ln.style.display='none'; return; }
        const [dx,dy]=spot; placed.push({x:p.x0+dx,y:p.y0+dy,w:W,h:H});
        p.e.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        const dist=Math.hypot(dx,dy);
        if(dist>6){
          if(!ln){ ln=document.createElement('div'); ln.className='clline'; wrap.insertBefore(ln, p.e); }
          ln.style.width=dist+'px'; ln.style.transform=`rotate(${Math.atan2(dy,dx)}rad)`; ln.style.display='';
        } else if(ln){ ln.style.display='none'; }
      });
    };
    map.on('zoomend moveend', ()=> requestAnimationFrame(layoutLabels));

    // 上部バーは「戻る」だけ（大陸選択は地図上のボタンで行う）
    const renderChips = () => {
      const chip = ct => `<button class="region-chip${ct.k===activeCont?' active':''}${contCount[ct.k]?'':' empty'}" data-k="${ct.k}">${ct.jp}<span class="rc-num">${contCount[ct.k]||0}</span></button>`;
      regionBar.innerHTML = (activeCont ? `<button class="region-chip back" data-back="1">← 全体</button>` : '') + CONTINENTS.map(chip).join('');
      regionBar.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', showOverview));
      regionBar.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', ()=> showContinent(b.dataset.k)));
    };

    // 各大陸の中心に「大陸ボタン」を配置する
    const buildContLabels = () => {
      contLabelGroup.clearLayers();
      CONTINENTS.forEach(ct => {
        if(!contBounds[ct.k]) return;            // 全大陸のボタンを表示（投稿0でも出す）
        const center = ct.at ? L.latLng(ct.at) : contBounds[ct.k].getCenter();
        const icon = L.divIcon({
          className:'area-wrap', iconSize:[0,0], iconAnchor:[0,0],
          html:`<button class="area-btn">${ct.jp}<span class="ab-num">${contCount[ct.k]}</span></button>`
        });
        L.marker(center, { icon }).on('click', ()=> showContinent(ct.k)).addTo(contLabelGroup);
      });
    };

    (async () => {
      const loading = document.getElementById('mapLoading');
      try{
        const snap = await getDocs(query(collection(db,"articles"), where("status","==","published")));
        const docs = [];
        snap.forEach(s => docs.push({ id:s.id, ...s.data() }));
        docs.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));

        // 国ごとに記事をまとめる（1記事が複数国に属する場合は各国に出す）
        const byCountry = {};
        docs.forEach(d => (d.countries||[]).forEach(c => {
          (byCountry[c] = byCountry[c] || []).push(d);
        }));

        // 大陸ごとのレイヤー群・投稿数（記事の重複なし）を準備
        const contArticleIds = {};
        CONTINENTS.forEach(ct => { contGroups[ct.k] = L.layerGroup(); contArticleIds[ct.k] = new Set(); });

        const shapes = await shapesP;
        const contFill = L.layerGroup();
        let placed = 0;
        Object.keys(byCountry).forEach(c => {
          const ll = llOf(c);
          if(!ll) return;                 // 座標未登録の国はスキップ
          const ct = contOfCountry(c);
          if(!ct) return;
          const arr = byCountry[c];
          arr.forEach(d => contArticleIds[ct].add(d.id));
          const iso = COUNTRY_ISO[c];
          const rings = (shapes[iso]||[]).map(r=>{ const out=[]; for(let i=0;i<r.length;i+=2){ let lng=r[i]; if(WRAP_CONT.has(ct)&&lng<0) lng+=360; out.push([r[i+1],lng]); } return out; });
          const op = arr.length>=4?0.95:arr.length>=2?0.75:0.55;
          if(rings.length){
            L.polygon(rings,{ color:'#ffffff', weight:1, fillColor:'#1f6f5b', fillOpacity:op })
              .on('click', ()=> openCountry(c, arr)).addTo(contGroups[ct]);
          }
          const name = (cinfo(c)||{}).jp || c;
          const icon = L.divIcon({ className:'cl-wrap', iconSize:[0,0], iconAnchor:[0,0],
            html:`<div class="cldot"></div><div class="clabel" data-n="${arr.length}">${esc(name)}<b>${arr.length}</b></div>` });
          L.marker(ll, { icon }).on('click', ()=> openCountry(c, arr)).addTo(contGroups[ct]);
          if(rings.length) contFill.addLayer(L.polygon(rings,{ stroke:false, fillColor:'#1f6f5b', fillOpacity:op }).on('click', ()=> showContinent(ct)));
          placed++;
        });
        CONTINENTS.forEach(ct => { contCount[ct.k] = contArticleIds[ct.k].size; });

        loading.remove();
        if(!placed){
          hint.hidden = false; hint.textContent = 'まだ地図に表示できる旅程がありません';
        } else {
          window.__contFill = contFill;
          buildContLabels();   // 大陸ボタンを各地域の中心に配置
          showOverview();      // 引き＋大陸ボタンから開始
        }
      }catch(err){
        console.error(err);
        loading.textContent = '読み込みに失敗しました';
      }
    })();
  </script>
  <script type="module" src="./auth-status.js"></script>
  <!-- Vercel Web Analytics -->
  <script defer src="/_vercel/insights/script.js"></script>
</body>
